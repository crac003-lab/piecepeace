<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿蛋音乐学习题库自测</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root{
  --paper:#f3ecdd; --card:#faf6ea; --ink:#3b3226; --faded:#8a7d66;
  --line:#d8cdb4; --terra:#b4552d; --moss:#5d7052; --gold:#b98c2f;
  --bad:#a63d2f; --warn:#b98c2f; --ok:#5d7052; --shadow:4px 4px 0 rgba(59,50,38,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Songti SC","Noto Serif SC","SimSun",Georgia,serif;
  background:var(--paper);
  background-image:radial-gradient(rgba(59,50,38,.05) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink);min-height:100vh;padding-bottom:60px;
}
header{max-width:720px;margin:0 auto;padding:42px 20px 10px;text-align:center}
.stamp{
  display:inline-block;border:2.5px double var(--terra);color:var(--terra);
  padding:4px 18px;font-size:12px;letter-spacing:6px;border-radius:3px;transform:rotate(-2deg);
}
header h1{font-size:30px;letter-spacing:8px;margin:16px 0 8px;font-weight:700}
header .sub{color:var(--faded);font-size:13px;letter-spacing:3px}
.rule{width:180px;margin:18px auto 0;border-top:1px solid var(--line);position:relative}
.rule i{position:absolute;top:-5px;left:50%;transform:translateX(-50%);background:var(--paper);padding:0 10px;color:var(--gold);font-style:normal;font-size:12px}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px}
.tabs{display:flex;gap:10px;justify-content:center;margin:22px 0 20px;flex-wrap:wrap}
.tabs button{
  font-family:inherit;padding:9px 22px;border:1.5px solid var(--ink);background:transparent;
  color:var(--ink);font-size:14px;letter-spacing:2px;cursor:pointer;border-radius:2px;transition:all .15s;
}
.tabs button.on{background:var(--ink);color:var(--paper);box-shadow:var(--shadow)}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:4px;padding:22px;margin-bottom:14px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stats div{background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:12px 6px;text-align:center}
.stats b{font-size:22px;display:block;font-weight:700}
.stats span{font-size:11px;color:var(--faded);letter-spacing:1px}
.bar{height:12px;border:1.5px solid var(--ink);border-radius:2px;overflow:hidden;background:var(--card);margin:4px 0 18px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--terra),var(--terra) 8px,#c96a41 8px,#c96a41 16px);transition:width .4s}
select{width:100%;padding:11px;border:1.5px solid var(--ink);border-radius:2px;background:var(--card);font-family:inherit;font-size:14px;color:var(--ink);margin-bottom:14px}
.btn{display:block;width:100%;padding:15px;border:1.5px solid var(--ink);border-radius:3px;background:var(--terra);color:#fdf8ec;font-family:inherit;font-size:17px;letter-spacing:4px;cursor:pointer;box-shadow:var(--shadow);transition:all .12s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(59,50,38,.18)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(59,50,38,.12)}
.btn.ghost{background:var(--card);color:var(--ink)}
.qtag{font-size:11px;color:var(--faded);letter-spacing:2px;margin-bottom:10px;display:flex;justify-content:space-between}
.qtext{font-size:17px;line-height:1.9;font-weight:600}
.ans{margin-top:14px;padding:14px;background:#f0e7cf;border-left:3px solid var(--gold);font-size:14px;line-height:1.9;white-space:pre-wrap;display:none}
.ans.show{display:block}
.showbtn{margin-top:12px;font-family:inherit;font-size:13px;padding:7px 16px;border:1px dashed var(--faded);background:transparent;color:var(--faded);cursor:pointer;border-radius:2px;letter-spacing:2px}
.showbtn:hover{color:var(--ink);border-color:var(--ink)}
.rate{display:flex;gap:10px;margin-top:14px}
.rate button{flex:1;padding:10px 0;font-family:inherit;font-size:14px;letter-spacing:2px;border:1.5px solid;border-radius:2px;background:#fff;cursor:pointer}
.rate .r2{border-color:var(--bad);color:var(--bad)}.rate .r1{border-color:var(--warn);color:var(--warn)}.rate .r0{border-color:var(--ok);color:var(--ok)}
.rate button.sel{background:currentColor;color:var(--card)!important}
.prog{font-size:12px;color:var(--faded);letter-spacing:2px;margin-bottom:12px;text-align:center}
.chrow{display:flex;justify-content:space-between;align-items:baseline;padding:12px 2px;border-bottom:1px dashed var(--line);font-size:14px}
.chrow .pct{font-weight:700}
footer{text-align:center;color:var(--faded);font-size:11px;letter-spacing:3px;margin-top:34px}
h3.sec{letter-spacing:3px;font-size:16px;margin:4px 0 12px}
@media(max-width:520px){header h1{font-size:22px;letter-spacing:5px}.stats b{font-size:17px}.qtext{font-size:15px}}
</style>
</head>
<body>
<header>
  <div class="stamp">自习室 · 试用版</div>
  <h1>阿蛋音乐学习题库</h1>
  <div class="sub">西方音乐史 · 曲式与作品分析 · 和声分析 — 共 670 题</div>
  <div class="rule"><i>❦</i></div>
</header>
<div class="wrap">
<div class="tabs">
  <button class="on" data-p="quiz">刷 题</button>
  <button data-p="stats">进 度</button>
  <button data-p="list">题 库</button>
</div>

<div id="p-quiz" class="panel on">
  <div class="stats">
    <div><b id="s-total">0</b><span>总题量</span></div>
    <div><b id="s-done">0</b><span>已自测</span></div>
    <div><b id="s-red">0</b><span>待巩固</span></div>
    <div><b id="s-green">0</b><span>已掌握</span></div>
  </div>
  <div class="bar"><i id="s-bar" style="width:0"></i></div>
  <select id="sel"></select>
  <button class="btn" onclick="start()">开 始 一 轮 · 四 题</button>
</div>

<div id="p-stats" class="panel">
  <h3 class="sec">各章掌握度</h3>
  <div class="card" id="chStats"></div>
  <button class="btn ghost" onclick="if(confirm('确定清空全部进度？')){localStorage.removeItem(KEY);location.reload()}">清 空 进 度</button>
</div>

<div id="p-list" class="panel">
  <select id="sel2" onchange="renderList()"></select>
  <div id="listBox"></div>
</div>
</div>
<footer>阿蛋音乐学习 · 自习室出品 · 进度保存在本机浏览器</footer>

<script>
const DATA=[{"id": 0, "ch": "第一章", "type": "填空", "q": "2. 古希腊主要有弦乐与管乐两类乐器，____和____分别是这两类乐器的代表。", "a": "里拉、阿夫洛斯管"}, {"id": 1, "ch": "第一章", "type": "填空", "q": "3. \"和谐论\"是由古希腊时期伟大的哲学家和数学家____提出的，他是第一个以理论的方式向人们解释音乐现象的人。", "a": "毕达哥拉斯"}, {"id": 2, "ch": "第一章", "type": "填空", "q": "4. 希腊古典时期伟大的三位悲剧诗人是____、____和____。", "a": "埃斯库罗斯、索福克勒斯、欧里庇得斯"}, {"id": 3, "ch": "第一章", "type": "填空", "q": "5. ____与____等哲学家的音乐思想奠定了音乐美学发展的基础。", "a": "柏拉图、亚里士多德"}, {"id": 4, "ch": "第一章", "type": "填空", "q": "6. 罗马教会的礼拜仪式分为____和____两大类。", "a": "赞美诗、圣歌"}, {"id": 5, "ch": "第一章", "type": "填空", "q": "7. 古罗马人于公元前 3 世纪在观看角斗时用于增加角斗气氛发明的一种乐器是____，它被认为是最早的____。", "a": "水压风琴、管风琴"}, {"id": 6, "ch": "第一章", "type": "简述题", "q": "9. lyre", "a": "原书答案指向：第一章，第七题第 1 点"}, {"id": 7, "ch": "第一章", "type": "简述题", "q": "10. aulos", "a": "原书答案指向：第一章，第七题第 2 点"}, {"id": 8, "ch": "第一章", "type": "简述题", "q": "11. hydraulos", "a": "原书答案指向：第一章，第八题第 2 点中的第 2 小点"}, {"id": 9, "ch": "第一章", "type": "简述题", "q": "13. 古希腊的悲剧的含义？", "a": "原书答案指向：第一章，第二题"}, {"id": 10, "ch": "第一章", "type": "简述题", "q": "14. 简述毕达哥拉斯的\"和谐论\"。", "a": "原书答案指向：第一章，第三题"}, {"id": 11, "ch": "第一章", "type": "简述题", "q": "15. 柏拉图与亚里士多德等人的音乐思想表现在哪些方面？", "a": "原书答案指向：第一章，第四题"}, {"id": 12, "ch": "第一章", "type": "简述题", "q": "16. 为什么说古罗马是古希腊音乐财富的继承者和发展者？", "a": "原书答案指向：第一章，第八题"}, {"id": 13, "ch": "第一章", "type": "简述题", "q": "17. 古罗马时期基督教文明对后世音乐产生了怎样的影响？", "a": "原书答案指向：第一章，第九题"}, {"id": 14, "ch": "第一章", "type": "简述题", "q": "18. 古希腊、古罗马音乐对西方音乐的贡献体现在哪些方面？", "a": "原书答案指向：第一章，第十题"}, {"id": 15, "ch": "第二章", "type": "填空", "q": "2. 格里高利圣咏服务于宗教礼拜，一般为无伴奏的纯人声____音乐形式，以____为歌词，无明显的节拍特征，建立在____调式基础上。", "a": "单声部、拉丁文、教会调式"}, {"id": 16, "ch": "第二章", "type": "填空", "q": "3. 单声部圣咏与歌词的搭配形式不同，可分为几种类型：一字对一音，称音节式；在同一音高上唱出相当数量的歌词，称____式；一字对几个音，旋律比音节式流动的，称____；一字对多个音，少则十几个音，多则五六十个音，常见于欢呼歌中的，称____。", "a": "圣咏（纽姆式/音团式）、花唱式"}, {"id": 17, "ch": "第二章", "type": "填空", "q": "4. 西方最早的复调音乐产生在____世纪，被称为____。", "a": "9 世纪、奥尔加农"}, {"id": 18, "ch": "第二章", "type": "填空", "q": "5. 中世纪兴起的复调音乐形式主要有____、____、____、____、____等。", "a": "奥尔加农、狄斯康特、孔特克图斯、克劳苏拉、经文歌"}, {"id": 19, "ch": "第二章", "type": "填空", "q": "6. 大约产生于 8 世纪，为了帮助圣咏的记忆，僧侣们在歌词的上方写下一些简单的记号，这种无固定音高符号谱被称为____；约 11 世纪时，中世纪最重要的音乐理论家圭多在前人的基础上发明了____；记谱法发展到 13 世纪时，德国的音乐理论家弗兰克在《____》中提出了标明音的长短的设想，15 世纪促成了____的产生。", "a": "纽姆谱、四线谱、《有量歌曲艺术》、五线谱"}, {"id": 20, "ch": "第二章", "type": "填空", "q": "7. 中世纪圣母院乐派中出现了两位已知的复调作曲家，他们对奥尔加农做出重要贡献，这两位作曲家是____、____。", "a": "莱奥南、佩罗坦"}, {"id": 21, "ch": "第二章", "type": "填空", "q": "8. 公元 9—11 世纪世俗音乐兴起，一些骑士们经常饮酒唱歌，歌曲内容多反映爱情生活，这些音乐形式在法国称为____，在德国称为____。", "a": "游吟诗人、恋诗歌手"}, {"id": 22, "ch": "第二章", "type": "填空", "q": "9. 13 世纪在意大利流行的世俗方言歌曲其主要形式有两种，它们是____、____。", "a": "巴拉塔、劳达赞歌"}, {"id": 23, "ch": "第二章", "type": "填空", "q": "10. \"新艺术\"由 14 世纪初法国天主教徒、诗人、音乐家____所写的《Ars Nova》一书而引起。", "a": "维特里"}, {"id": 24, "ch": "第二章", "type": "填空", "q": "11. 14 世纪意大利最有影响的盲人音乐家____创有著名的____，即一种旋律格式，也被人称为 si—la—do 终止式。", "a": "兰迪尼、兰迪尼终止式"}, {"id": 25, "ch": "第二章", "type": "简述题", "q": "13. Mass", "a": "原书答案指向：第二章，第二题第 3 点中的第 2 小点"}, {"id": 26, "ch": "第二章", "type": "简述题", "q": "14. musica ficta", "a": "原书答案指向：第二章，第五题"}, {"id": 27, "ch": "第二章", "type": "简述题", "q": "15. neumes", "a": "原书答案指向：第二章，第六题"}, {"id": 28, "ch": "第二章", "type": "简述题", "q": "16. Guido d'Arezzo", "a": "原书答案指向：第二章，第七题第 1 点中的第二自然段"}, {"id": 29, "ch": "第二章", "type": "简述题", "q": "17. mensural notation", "a": "原书答案指向：第二章，第八题"}, {"id": 30, "ch": "第二章", "type": "简述题", "q": "18. lituan drama（拉丁戏剧/宗教剧）", "a": "原书答案指向：第二章，第九题第 3 点"}, {"id": 31, "ch": "第二章", "type": "简述题", "q": "19. organum", "a": "原书答案指向：第二章，第十题"}, {"id": 32, "ch": "第二章", "type": "简述题", "q": "20. sequence", "a": "原书答案指向：第二章，第九题第 2 点"}, {"id": 33, "ch": "第二章", "type": "简述题", "q": "21. tenor", "a": "原书答案指向：第二章，第十一题第 1 点第 4 小点中的第二自然段"}, {"id": 34, "ch": "第二章", "type": "简述题", "q": "22. melismatic organum", "a": "原书答案指向：第二章，第十一题第 1 点第 4 小点中的第一自然段"}, {"id": 35, "ch": "第二章", "type": "简述题", "q": "23. trope", "a": "原书答案指向：第二章，第九题第 1 点"}, {"id": 36, "ch": "第二章", "type": "简述题", "q": "24. discant", "a": "原书答案指向：第二章，第  "2. 文艺复兴时期，声乐复调的发展进入到盛期，该时期的复调音乐发展可分为四个阶段：第一阶段（15 世纪初）____乐派，代表作曲家杜费；第二阶段（15 世纪中后期）____乐派，代表作曲家奥克冈；第三阶段（16 世纪中叶）____乐派，代表作曲家帕勒斯特里那；第四阶段（16 世纪下半叶）____乐派，代表作曲家维拉尔特等。", "a": "勃艮第乐派、佛兰德斯乐派、罗马乐派、威尼斯乐派"}, {"id": 59, "ch": "第三章", "type": "填空", "q": "3. 文艺复兴时期有两个新的调式被广泛使用，后来直接影响了大小调的产生，它们是____和____调式。", "a": "爱奥尼亚、伊奥尼亚"}, {"id": 60, "ch": "第三章", "type": "填空", "q": "4. 宗教改革始于 1517 年 10 月 31 日的德国，随后波及整个欧洲，改革运动的领袖是____。他以\"赎罪券\"之事撰写了《95 条论纲》，最终脱离天主教，创立了____。", "a": "马丁·路德；新教（路德教）"}, {"id": 61, "ch": "第三章", "type": "填空", "q": "5. 新教音乐与天主教音乐的不同，主要反映在用母语唱圣歌上，这些圣歌在不同的国家被冠以不同的名称：在德国被称为____，在法国和瑞士被称为____，在英国则被称为____。", "a": "众赞歌、格律诗篇、礼拜乐和赞美歌"}, {"id": 62, "ch": "第三章", "type": "填空", "q": "6. 世俗性声乐体裁在文艺复兴时期得到了很大的发展，在意大利有弗罗托拉、____；在法国有____；在英国有____；在德国有____。", "a": "劳达赞歌（或维拉内拉或牧歌）、尚松、英国牧歌、利德"}, {"id": 63, "ch": "第三章", "type": "填空", "q": "7. 16 世纪的牧歌创作进入繁荣时期，它在____、____等人的手中渐趋成熟，17 世纪初在蒙特威尔第的影响下发展到顶峰，成为教堂音乐之外最重要的音乐体裁。", "a": "玛林秋、杰苏阿尔多"}, {"id": 64, "ch": "第三章", "type": "填空", "q": "8. 文艺复兴时期最流行的弹拨乐器是____；这个时期弓弦乐器古提琴家族的____已出现；键盘乐器有____、____、____等，其中____在教堂音乐中运用得较为普遍。", "a": "琉特琴、维奥尔琴；管风琴、古钢琴、大键琴；管风琴"}, {"id": 65, "ch": "第三章", "type": "填空", "q": "9. 16 世纪仍是声乐艺术占主流，但具有独立意义的器乐曲体裁渐渐脱颖而出。从舞曲中脱颖而出的器乐体裁有____、____、____等；从声乐曲中脱颖而出的器乐体裁有____、____；另外还有三种一直沿用至今、带有即兴风格技巧性的器乐体裁，它们是____、____、____。", "a": "阿勒曼德舞曲、库朗特舞曲、帕凡舞曲（或加亚尔德舞曲、帕萨梅佐舞曲、萨尔塔雷洛舞曲）；利切卡尔、坎佐纳；幻想曲、前奏曲、托卡塔"}, {"id": 66, "ch": "第三章", "type": "简述题", "q": "11. Flemmich School", "a": "原书答案指向：第三章，第四题第 1 点"}, {"id": 67, "ch": "第三章", "type": "简述题", "q": "12. Roman School", "a": "原书答案指向：第三章，第五题第 1 点"}, {"id": 68, "ch": "第三章", "type": "简述题", "q": "13. Venetian School", "a": "原书答案指向：第三章，第六题第 1 点"}, {"id": 69, "ch": "第三章", "type": "简述题", "q": "14. chorale", "a": "原书答案指向：第三章，第八题第 1 点"}, {"id": 70, "ch": "第三章", "type": "简述题", "q": "15. frottola", "a": "原书答案指向：第三章，第十题"}, {"id": 71, "ch": "第三章", "type": "简述题", "q": "16. lauda", "a": "原书答案指向：第三章，第十一题"}, {"id": 72, "ch": "第三章", "type": "简述题", "q": "17. villanella", "a": "原书答案指向：第三章，第十二题"}, {"id": 73, "ch": "第三章", "type": "简述题", "q": "18. madrigal", "a": "原书答案指向：第三章，第十三题第 1 点"}, {"id": 74, "ch": "第三章", "type": "简述题", "q": "19. chanson", "a": "原书答案指向：第三章，第十四题"}, {"id": 75, "ch": "第三章", "type": "简述题", "q": "20. consort", "a": "原书答案指向：第三章，第十五题"}, {"id": 76, "ch": "第三章", "type": "简述题", "q": "21. lied", "a": "原书答案指向：第三章，第十七题第 2 点"}, {"id": 77, "ch": "第三章", "type": "简述题", "q": "22. villancico", "a": "原书答案指向：第三章，第十八题"}, {"id": 78, "ch": "第三章", "type": "简述题", "q": "23. Canzona", "a": "原书答案指向：第三章，第二十二题"}, {"id": 79, "ch": "第三章", "type": "简述题", "q": "25. 简述文艺复兴时期复调音乐的发展。", "a": "原书答案指向：第三章，第二题"}, {"id": 80, "ch": "第三章", "type": "简述题", "q": "26. 宗教改革后产生了哪些新教音乐？", "a": "原书答案指向：第三章，第八题"}, {"id": 81, "ch": "第三章", "type": "简述题", "q": "27. 简介罗马乐派作曲家帕勒斯特里那的音乐风格。", "a": "原书答案指向：第三章，第五题第 2 点"}, {"id": 82, "ch": "第三章", "type": "简述题", "q": "28. 威尼斯乐派的主要贡献有哪些？", "a": "原书答案指向：第三章，第六题第 2 点"}, {"id": 83, "ch": "第三章", "type": "简述题", "q": "29. 简述弥撒曲的发展。", "a": "原书答案指向：第三章，第七题"}, {"id": 84, "ch": "第三章", "type": "简述题", "q": "30. 简述宗教改革对天主教音乐的影响。", "a": "原书答案指向：第三章，第九题"}, {"id": 85, "ch": "第三章", "type": "简述题", "q": "31. 简述文艺复兴时期意大利牧歌的发展。", "a": "原书答案指向：第三章，第十三题"}, {"id": 86, "ch": "第三章", "type": "简述题", "q": "32. 简述文艺复兴时期英国牧歌的发展。", "a": "原书答案指向：第三章，第十六题"}, {"id": 87, "ch": "第三章", "type": "简述题", "q": "33. 文艺复兴时期的乐器有哪些？", "a": "原书答案指向：第三章，第十九题"}, {"id": 88, "ch": "第三章", "type": "简述题", "q": "34. 文艺复兴时期产生了哪些具有独立意义的器乐体裁？", "a": "原书答案指向：第三章，第二十题"}, {"id": 89, "ch": "第三章", "type": "简述题", "q": "35. 利切卡尔与幻想曲的区别是什么？", "a": "原书答案指向：第三章，第二十一题"}, {"id": 90, "ch": "第三章", "type": "简述题", "q": "36. 与中世纪相比，文艺复兴时期音乐有哪些重要发展？", "a": "原书答案指向：第三章，第二十三题"}, {"id": 91, "ch": "第四章", "type": "填空", "q": "2. 1597 年上演了由利努契尼写剧本、佩里作曲的____，由于该作品的乐谱只留下残片，所以人们通常把 1600 年上演、保留完整的、由利努契尼写脚本、佩里和卡契尼作曲的____视为最早的一部歌剧。", "a": "《达芙尼》、《优丽狄茜》"}, {"id": 92, "ch": "第四章", "type": "填空", "q": "3. 1600 年 2 月上演了由罗马作曲家卡瓦莱里创作的____，该剧为罗马歌剧奠定了基础。实际上这部作品被史学界视为最早的一部清唱剧，它具有歌剧的雏形。", "a": "《灵与肉的体现》"}, {"id": 93, "ch": "第四章", "type": "填空", "q": "4. 威尼斯歌剧作曲家____创作的歌剧《奥菲欧》，是自歌剧诞生后第一部真正意义的歌剧，它使歌剧艺术从此进入一个成熟的发展期。", "a": "蒙特威尔第"}, {"id": 94, "ch": "第四章", "type": "填空", "q": "5. 巴罗克时期的古组曲是由不同国家的四种不同风格的舞曲组成的，分别是____、____、____、____。", "a": "德国的阿勒曼德、法国的库朗特、西班牙的萨拉班德、英国的吉格"}, {"id": 95, "ch": "第四章", "type": "填空", "q": "6. 意大利作曲家____对大协奏曲的定型起决定性的作用，确立了快、慢、快的三乐章结构，他创作了著名的大协奏曲____，分别题为《春》《夏》《秋》《冬》，对标题音乐作出一定的贡献。", "a": "维瓦尔第、《四季》"}, {"id": 96, "ch": "第四章", "type": "填空", "q": "7. 意大利作曲家____确立了那不勒斯歌剧序曲快—慢—快的三段形式，使之成为交响曲的先声。", "a": "A. 斯卡拉蒂"}, {"id": 97, "ch": "第四章", "type": "填空", "q": "8. 塔蒂尼于 1714 年发现____，当时被作曲家本人称为\"第三音\"。", "a": "合成音"}, {"id": 98, "ch": "第四章", "type": "填空", "q": "9. 作曲家____创作的清唱剧《弥赛亚》于 1742 年首演于都柏林，该剧使他名扬世界，并成为音乐史上的经典之作；他的器乐作品《皇家烟火音乐》和____是巴罗克时期的杰作，为世人传颂。", "a": "亨德尔、《水上音乐》"}, {"id": 99, "ch": "第四章", "type": "填空", "q": "10. 巴赫的作品____首次将十二平均律全面系统地运用到音乐创作实践中，他的另外两部复调艺术精品____、____把复调技巧发展到登峰造极的程度，总结了中世纪以来的复调音乐写作技术。", "a": "《平均律钢琴曲集》、《音乐的奉献》、《赋格的艺术》"}, {"id": 100, "ch": "第四章", "type": "简述题", "q": "12. Stile concertato", "a": "原书答案指向：第四章，第二题第 2 点"}, {"id": 101, "ch": "第四章", "type": "简述题", "q": "13. oratorio", "a": "原书答案指向：第四章，第八题第 1 点"}, {"id": 102, "ch": "第四章", "type": "简述题", "q": "14. cantata", "a": "原书答案指向：第四章，第九题"}, {"id": 103, "ch": "第四章", "type": "简述题", "q": "15. passion", "a": "原书答案指向：第四章，第十题"}, {"id": 104, "ch": "第四章", "type": "简述题", "q": "16. Trio sonata", "a": "原书答案指向：第四章，第十四题第 1 点中的\"三重奏鸣曲\"内容"}, {"id": 105, "ch": "第四章", "type": "简述题", "q": "17. toccata", "a": "原书答案指向：第四章，第十六题"}, {"id": 106, "ch": "第四章", "type": "简述题", "q": "18. Plant style", "a": "原书答案指向：第四章，第二十八题第 4 点"}, {"id": 107, "ch": "第四章", "type": "简述题", "q": "19. prelude", "a": "原书答案指向：第四章，第十八题"}, {"id": 108, "ch": "第四章", "type": "简述题", "q": "20. Fugue", "a": "原书答案指向：第四章，第十七题"}, {"id": 109, "ch": "第四章", "type": "简述题", "q": "21. dance Suite", "a": "原书答案指向：第四章，第十九题"}, {"id": 110, "ch": "第四章", "type": "简述题", "q": "22. allemande", "a": "原书答案指向：第四章，第十九题第 2 点中的第 1 小点"}, {"id": 111, "ch": "第四章", "type": "简述题", "q": "23. Courant", "a": "原书答案指向：第四章，第十九题第 2 点中的第 2 小点" 创作了____部交响曲，____部歌剧，____部弦乐四重奏和____首钢琴奏鸣曲。", "a": "9、1、16、32"}, {"id": 150, "ch": "第五章", "type": "填空", "q": "10. 贝多芬从他的第三交响曲开始，在第三乐章中以____取代了宫廷气质的小步舞曲。", "a": "谐谑曲"}, {"id": 151, "ch": "第五章", "type": "简述题", "q": "12. opera comique", "a": "原书答案指向：第五章，第五题中的第四自然段"}, {"id": 152, "ch": "第五章", "type": "简述题", "q": "13. ballad opera", "a": "原书答案指向：第五章，第五题中的第五自然段"}, {"id": 153, "ch": "第五章", "type": "简述题", "q": "14. Singspiel", "a": "原书答案指向：第五章，第五题中的第六自然段"}, {"id": 154, "ch": "第五章", "type": "简述题", "q": "15. chamber music", "a": "原书答案指向：第五章，第六题第 1 点"}, {"id": 155, "ch": "第五章", "type": "简述题", "q": "16. sonata", "a": "原书答案指向：第五章，第八题"}, {"id": 156, "ch": "第五章", "type": "简述题", "q": "17. sonata form", "a": "原书答案指向：第五章，第九题中的后半部内容"}, {"id": 157, "ch": "第五章", "type": "简述题", "q": "18. symphony", "a": "原书答案指向：第五章，第十一题中的第一、第二自然段"}, {"id": 158, "ch": "第五章", "type": "简述题", "q": "19. Mannheim School", "a": "原书答案指向：第五章，第十二题第 1 点"}, {"id": 159, "ch": "第五章", "type": "简述题", "q": "20. Berlin School", "a": "原书答案指向：第五章，第十二题第 2 点"}, {"id": 160, "ch": "第五章", "type": "简述题", "q": "21. Viennese Classical School", "a": "原书答案指向：第五章，第十二题第 3 点"}, {"id": 161, "ch": "第五章", "type": "简述题", "q": "23. 简述格鲁克和他的歌剧改革。", "a": "原书答案指向：第五章，第四题"}, {"id": 162, "ch": "第五章", "type": "简述题", "q": "24. 简述喜歌剧的产生与发展。", "a": "原书答案指向：第五章，第五题"}, {"id": 163, "ch": "第五章", "type": "简述题", "q": "25. 简述室内乐的产生及其发展。", "a": "原书答案指向：第五章，第六题"}, {"id": 164, "ch": "第五章", "type": "简述题", "q": "26. 简述奏鸣曲与奏鸣曲式的区别。", "a": "原书答案指向：第五章，第九题"}, {"id": 165, "ch": "第五章", "type": "简述题", "q": "27. 简述协奏曲的发展。", "a": "原书答案指向：第五章，第十题"}, {"id": 166, "ch": "第五章", "type": "简述题", "q": "28. 简述交响曲的产生、发展及其特征。", "a": "原书答案指向：第五章，第十一题"}, {"id": 167, "ch": "第五章", "type": "简述题", "q": "29. 简述海顿的创作及艺术成就。", "a": "原书答案指向：第五章，第十三题"}, {"id": 168, "ch": "第五章", "type": "简述题", "q": "30. 曼海姆乐派和维也纳古典乐派的贡献表现在哪些方面？", "a": "原书答案指向：第五章，第十二题第 1 点和第 3 点"}, {"id": 169, "ch": "第五章", "type": "简述题", "q": "31. 简述莫扎特的创作和艺术成就。", "a": "原书答案指向：第五章，第十四题"}, {"id": 170, "ch": "第五章", "type": "简述题", "q": "32. 简述贝多芬的创作、艺术成就及音乐中的人文主义思想。", "a": "原书答案指向：第五章，第十五题第 1—3 点"}, {"id": 171, "ch": "第五章", "type": "简述题", "q": "33. 简述贝多芬音乐中的人文主义思想。", "a": "原书答案指向：第五章，第十五题第 4 点"}, {"id": 172, "ch": "第六章", "type": "填空", "q": "2. \"艺术歌曲之王\"____创作了六百多首艺术歌曲，两部声乐套曲____、____。此外，他还创作了九部交响曲，其中____只有两个乐章。", "a": "舒伯特、《美丽的磨坊女》、《冬之旅》、《第八交响曲》"}, {"id": 173, "ch": "第六章", "type": "填空", "q": "3. \"无词歌\"是由____首创的钢琴小品，包括 6 卷 48 首小曲，此外，他还创作了著名的管弦乐序曲____。", "a": "门德尔松、《仲夏夜之梦》"}, {"id": 174, "ch": "第六章", "type": "填空", "q": "4. 舒曼创作了多部钢琴套曲，这些作品把一首首钢琴小品按照一定的构思组合成套，并冠以各种富有诗意文学性标题，如____、____等，此外，他还创作了声乐套曲____、____。", "a": "《童年情景》（或《狂欢节》或《大卫同盟曲集》）、《妇女的爱情与生活》、《诗人之恋》"}, {"id": 175, "ch": "第六章", "type": "填空", "q": "5. 乐剧是德国音乐家____首创的歌剧体裁，代表作有____、____、____等，在作品中他倡导____、____、____等手法。", "a": "瓦格纳；《尼伯龙根的指环》、《特里斯坦与伊索尔德》、《漂泊的荷兰人》（或《罗恩格林》《汤豪瑟》《黎恩济》《纽伦堡的名歌手》《帕西法尔》）；整体艺术观、无终旋律、主导动机"}, {"id": 176, "ch": "第六章", "type": "填空", "q": "6. ____被誉为\"圆舞曲之王\"，其广为流传、颇具代表性的圆舞曲有____、____、____等。", "a": "约翰·施特劳斯；《蓝色多瑙河》、《维也纳森林的故事》、《春之声》（或《南国玫瑰》《艺术家的生涯》《皇帝圆舞曲》）"}, {"id": 177, "ch": "第六章", "type": "填空", "q": "7. 在交响曲中，不仅使用大标题，而且每个乐章都冠以小标题和详细的文字解说，并用\"固定乐思\"代表主人公的形象，首次运用这种形式进行创作的是____国作曲家____，代表作品是____。", "a": "法、柏辽兹、《幻想交响曲》"}, {"id": 178, "ch": "第六章", "type": "填空", "q": "8. 浪漫主义时期代表法国喜歌剧最高成就的是作曲家____和他的作品____。", "a": "比才、歌剧《卡门》"}, {"id": 179, "ch": "第六章", "type": "填空", "q": "9. 浪漫主义初期意大利歌剧的三个代表人物是____、____、____；威尔第是意大利浪漫主义歌剧的集大成者，而____的歌剧在艺术性和思想性上以真实主义歌剧为基础，他的优秀歌剧作品有____、____、____等。", "a": "罗西尼、贝里尼、唐尼采蒂；普契尼；《绣花女》、《托斯卡》（或《蝴蝶夫人》或《图兰多》）"}, {"id": 180, "ch": "第六章", "type": "填空", "q": "10. 交响诗由作曲家____首创，____乐章，往往表现了一定的意境、情感、哲理，他的交响诗代表作有____、____等。", "a": "李斯特、单、《前奏曲》、《塔索》"}, {"id": 181, "ch": "第六章", "type": "填空", "q": "11. 强力集团的五位作曲家分别是____、____、____、____和____。", "a": "巴拉基列夫、穆索尔斯基、里姆斯基-科萨科夫、鲍罗丁、居伊"}, {"id": 182, "ch": "第六章", "type": "填空", "q": "12. 作曲家____在阅读了阿拉伯民间故事集《一千零一夜》后有感而作交响组曲____。", "a": "里姆斯基-科萨科夫、《舍赫拉查达》"}, {"id": 183, "ch": "第六章", "type": "填空", "q": "13. ____是捷克民族乐派的奠基者，他为捷克民族歌剧和交响诗的发展打下了基础，他的交响诗套曲____中的第二首____，生动地描写了河流两岸的秀美风光、人民的风俗生活。", "a": "斯美塔那、《我的祖国》、《沃尔塔瓦河》"}, {"id": 184, "ch": "第六章", "type": "填空", "q": "14. 表达了作曲家作为一个捷克人身在美国的种种印象和感受的一部交响乐作品是作曲家____创作的____。", "a": "德沃夏克、第九交响曲《自新大陆》"}, {"id": 185, "ch": "第六章", "type": "填空", "q": "15. 芬兰民族乐派作曲家____的很多作品都贯穿着芬兰的民族精神，充满了史诗般的气势，其代表作交响诗____是芬兰民族解放斗争的象征。", "a": "西贝柳斯、《芬兰颂》"}, {"id": 186, "ch": "第六章", "type": "填空", "q": "16. 构思宏伟、乐队规模巨大的\"千人交响曲\"是作曲家____创作的交响曲，他的作品交响声乐套曲____以中国唐诗为歌词，体现了深刻的哲学构思。", "a": "马勒、《大地之歌》"}, {"id": 187, "ch": "第六章", "type": "简述题", "q": "18. Das Musikdrama", "a": "原书答案指向：第六章，第二题附相关概念注解中的第 2 点"}, {"id": 188, "ch": "第六章", "type": "简述题", "q": "19. unendlich Melodie（无终旋律）", "a": "原书答案指向：第六章，第二题附相关概念注解中的第 3 点"}, {"id": 189, "ch": "第六章", "type": "简述题", "q": "20. Das Leitmotiv（主导动机）", "a": "原书答案指向：第六章，第二题附相关概念注解中的第 4 点"}, {"id": 190, "ch": "第六章", "type": "简述题", "q": "21. Rescue opera（拯救歌剧）", "a": "原书答案指向：第六章，第三题第 1 点"}, {"id": 191, "ch": "第六章", "type": "简述题", "q": "22. Grand opera（大歌剧）", "a": "原书答案指向：第六章，第三题第 2 点"}, {"id": 192, "ch": "第六章", "type": "简述题", "q": "23. opera buffa（谐歌剧）", "a": "原书答案指向：第六章，第三题第 3 点"}, {"id": 193, "ch": "第六章", "type": "简述题", "q": "24. lyric opera（抒情歌剧）", "a": "原书答案指向：第六章，第三题第 4 点"}, {"id": 194, "ch": "第六章", "type": "简述题", "q": "25. Lied", "a": "原书答案指向：第六章，第六题第 4 点"}, {"id": 195, "ch": "第六章", "type": "简述题", "q": "26. songs without words", "a": "原书答案指向：第六章，第七题第 3 点的前半部"}, {"id": 196, "ch": "第六章", "type": "简述题", "q": "27. Walzer", "a": "原书答案指向：第六章，第十题附相关概念注解中的第 1 点"}, {"id": 197, "ch": "第六章", "type": "简述题", "q": "28. polka", "a": "原书答案指向：第六章，第十题附相关概念注解中的第 2 点"}, {"id": 198, "ch": "第六章", "type": "简述题", "q": "29. mazurka", "a": "原书答案指向：第六章，第十六题附相关概念注解中的第 1 点"}, {"id": 199, "ch": "第六章", "type": "简述题", "q": "30. polonaise", "a": "原书答案指向：第六章，第十六题附相关概念注解中的第 2 点"}, {"id": 200, "ch": "第六章", "type": "简述题", "q": "31. nocturne", "a": "原书答案指向：第六章，第十六题附相关概念注解中的第 3 点"}, {"id": 201, "ch": "第六章", "type": "简述题", "q": "32. Etude", "a": "原书答案指向：第六章，第十六题附相关概念注解中的第 4 点"}, {"id": 202, "ch": "第六章", "type": "简述题", "q": "33. Symphonic poem", "a": "原书答案指向：第六章，第十七题附相关概念注解中的第 1 点"}, {"id": 203, "ch": "第六章", "type": "简述题", "q": "34. Rhapsody", "a": "原书答案指向：第六章，第十七题附相关概念注解中的第 2 点"}, {"id": 204, "ch": "第六章", "type": "简述题", "q": "35. csardas", "a": "原书答案指向：第六章，第十七题附相关概念注解中的第 3 点"}, {"id": 205, "ch": "第六章", "type": "简述题", "q": "36. nationalism", "a": "原书答案指向：第六章，第十八题第 1 点第二自然段和第 2 点"}, {"id": 206, "ch": "第六章", "type": "简述题", "q": "37. 真实主义歌剧", "a": "原书答案指向：第六章，第五题"}, {"id": 207, "ch": "第六章", "type": "简述题", "q": "38. 强力集团", "a": "原书答案指向：第六章，第二十题第一自然段"}, {"id": 208, "ch": "第六章", "type": "简述题", "q": "40. 简述威伯歌剧的创作特征。", "a": "原书答案指向：第六章，第二题第 1 点中的第 3 点"}, {"id": 209, "ch": "第六章", "type": "简述题", "q": "41. 简述瓦格纳\"乐剧\"的创作特征。", "a": "原书答案指向：第六章，第二题第 2 点中的第 3 点"}, {"id": 210, "ch": "第六章", "type": "简述题", "q": "42. 简述浪漫主义时期法国歌剧的发展。", "a": "原书答案指向：第六章，第三题"}, {"id": 211, "ch": "第六章", "type": "简述题", "q": "43. 简述比才歌剧的创作特征。", "a": "原书答案指向：第六章，第三题第 5 点"}, {"id": 212, "ch": "第六章", "type": "简述题", "q": "44. 简述 19 世纪意大利歌剧从罗西尼、威尔第到普契尼的发展。", "a": "原书答案指向：第六章，第四题"}, {"id": 213, "ch": "第六章", "type": "简述题", "q": "45. 简述舒伯特、门德尔松、舒曼、勃拉姆斯、肖邦、李斯特、理查·施特劳斯、柏辽兹的艺术贡献。", "a": "原书答案指向：第六章，第六题第 3 点、第七题第 3 点、第八题第 3 点、第九题第 3 点、第十题第 3 点、第十七题第 3 点、第十五题第 3 点、第十四题第 3 点"}, {"id": 214, "ch": "第六章", "type": "简述题", "q": "46. 简述马勒的艺术成就。", "a": "原书答案指向：第六章，第十三题第 3 点"}, {"id": 215, "ch": "第六章", "type": "简述题", "q": "47. 简述布鲁克纳的艺术成就。", "a": "原书答案指向：第六章，第十二题第 3 点"}, {"id": 216, "ch": "第六章", "type": "简述题", "q": "48. 简述沃尔夫的艺术成就。", "a": "原书答案指向：第六章，第十一题第 3 点"}, {"id": 217, "ch": "第六章", "type": "简述题", "q": "49. 简述 19 世纪艺术歌曲的发展。", "a": "原书答案指向：第六章，参阅第六题、第七题、第八题、第十一题、第十三题、第十四题"}, {"id": 218, "ch": "第六章", "type": "简述题", "q": "50. 谈谈真实主义歌剧的产生与发展。", "a": "原书答案指向：第六章，第五题第一自然段和第四题第 3 点中的第五自然段"}, {"id": 219, "ch": "第六章", "type": "简述题", "q": "51. 何谓民族乐派？", "a": "原书答案指向：第六章，第十八题"}, {"id": 220, "ch": "第六章", "type": "简述题", "q": "52. 为什么称斯美塔那为捷克民族主义音乐的开创人？", "a": "原书答案指向：第六章，第二十四题第 1、3 点"}, {"id": 221, "ch": "第六章", "type": "简述题", "q": "53. 与斯美塔那相比德沃夏克音乐的民族风格表现在哪些方面？", "a": "原书答案指向：第六章，第二十五题第 3 点"}, {"id": 222, "ch": "第六章", "type": "简述题", "q": "54. 简述格里格的艺术成就和创作特点。", "a": "原书答案指向：第六章，第二十六题"}, {"id": 223, "ch": "第六章", "type": "简述题", "q": "55. 简述西贝柳斯音乐创作中的民族主义精神。", "a": "原书答案指向：第六章，第二十七题"}, {"id": 224, "ch": "第六章", "type": "简述题", "q": "56. 格林卡的民族风格表现在哪些方面？", "a": "原书答案指向：第六章，第十九题"}, {"id": 225, "ch": "第六章", "type": "简述题", "q": "57. 简述强力集团及其代表作品。", "a": "原书答案指向：第六章，第二十题"}, {"id": 226, "ch": "第六章", "type": "简述题", "q": "58. 简述斯克里亚宾的音乐风格。", "a": "原书答案指向：第六章，第二十二题第 3 点"}, {"id": 227, "ch": "第六章", "type": "简述题", "q": "59. 简述柴科夫斯基的艺术成就。", "a": "原书答案指向：第六章，第二十一题第 3 点"}, {"id": 228, "ch": "第六章", "type": "简述题", "q": "60. 晚期浪漫主义作曲家理查·施特劳斯的音乐创作在哪些方面发展了浪漫主义音乐？", "a": "原书答案指向：第六章，第十四题第 3 点"}, {"id": 229, "ch": "第六章", "type": "简述题", "q": "61. 简述拉赫玛尼诺夫的艺术成就。", "a": "原书答案指向：第六章，第二十三题"}, {"id": 230, "ch": "第七章", "type": "填空", "q": "2. 表现主义音乐的代表作曲家是____、____、____，由于他们三人都在维也纳发展，所以也被称为\"____\"。", "a": "勋伯格、贝尔格、韦伯恩；新维也纳乐派"}, {"id": 231, "ch": "第七章", "type": "填空", "q": "3. 在勋伯格创作的表现主义风格时期中，重要作品有____、____等。", "a": "《月迷彼埃罗》、《一个华沙幸存者》（或《乐队变奏曲》）"}, {"id": 232, "ch": "第七章", "type": "填空", "q": "4. 歌剧《露露》是奥地利作曲家____的代表作品之一，他创作的以安魂曲形式悼念少女曼侬之死的作品____成为十二音音乐的经典，此外，____结合运用古典结构和无调性手法，成为 20 世纪最重要的歌剧作品。", "a": "贝尔格、《小提琴协奏曲》、《沃切克》"}, {"id": 233, "ch": "第七章", "type": "填空", "q": "5. 新古典主义音乐取意于意大利作曲家____发表的一封公开信《新的古典主义》，其标志性音乐作品是作曲家____于 1920 年创作的舞剧《浦契涅拉》。", "a": "布索尼、斯特拉文斯基"}, {"id": 234, "ch": "第七章", "type": "填空", "q": "6. ____是斯特拉文斯基 1913 年创作的舞剧音乐，20 世纪影响最大的作品之一，它描写了俄国古代未开化民族在春天祭献大地的仪式。", "a": "《春之祭》"}, {"id": 235, "ch": "第七章", "type": "填空", "q": "7. 欣德米特是新古典主义音乐的重要作曲家，他将巴赫以及更古老音乐的特点融入现代手法进行创作。1934 年，欣德米特从自己创作的同名歌剧音乐中选编了交响曲____，成为他的代表作之一；此外，他还著有____和____等，这些著作是 20 世纪作曲理论的重要著述。", "a": "《画家马蒂斯》、《作曲指南》、《论西方的三种和声体系》"}, {"id": 236, "ch": "第七章", "type": "填空", "q": "8. 1920 年法国音乐评论家亨利·科莱写了一篇题为《俄国的\"五人团\"与法国的\"六人团\"》的文章，其中法国\"六人团\"的提法引起了人们的共识，并由此流传开来，这六人分别是指____、____、____、____、____和____。", "a": "奥里克、迪雷、奥涅格、米约、普朗克和泰莱菲雷"}, {"id": 237, "ch": "第七章", "type": "填空", "q": "9. \"六人团\"是 20 世纪 20 年代法国音乐界的代表人物，为法国音乐的发展做出了重要贡献，其中管弦乐《太平洋 231》和哑剧音乐《屋顶上的公牛》分别是____和____的代表作品。", "a": "奥涅格、米约"}, {"id": 238, "ch": "第七章", "type": "填空", "q": "10. 20 世纪新民族主义音乐的主要代表作曲家：匈牙利有____和____；波兰有____；罗马尼亚有____；英国有____；美国有____和____；西班牙有____等。", "a": "巴托克、科达伊；席曼诺夫斯基；埃内斯库；威廉斯；艾夫斯、科普兰和格什温；法雅"}, {"id": 239, "ch": "第七章", "type": "填空", "q": "11. ____是匈牙利作曲家、民族音乐学家，是 20 世纪民族音乐学的奠基人，其代表作有钢琴曲《献给孩子们》、____和歌剧____等。", "a": "巴托克、《小宇宙》（或《第三钢琴协奏曲》）、《蓝胡子公爵的城堡》"}, {"id": 240, "ch": "第七章", "type": "填空", "q": "12. ____是 20 世纪最富有美国特色的一位作曲家，他将美国爵士乐的音乐素材与古典作曲技法熔于一炉，代表作品钢琴与乐队____以爵士乐为特点，为爵士乐走向世界舞台起了积极作用。", "a": "格什温、《蓝色狂想曲》"}, {"id": 241, "ch": "第七章", "type": "填空", "q": "13. ____是第一位被国际公认为具有本土风格的美国作曲家，他的作品充满了美洲风情和西部牛仔歌曲的浓郁韵味，是民族主义音乐风格的集中反映，其代表作品是由舞剧音乐改编的组曲《小伙子比利组曲》和____。", "a": "科普兰、《牧区竞技组曲》"}, {"id": 242, "ch": "第七章", "type": "填空", "q": "14. 霍尔斯特对复兴 20 世纪英国音乐做出了重要贡献，他的音乐创作常与古文化相结合，塑造出独特的神秘色彩，作于 1916 年、以太阳系八大行星中的七个星球命名的七乐章交响乐____就是这样一首独辟蹊径的名作。", "a": "《行星组曲》"}, {"id": 243, "ch": "第七章", "type": "填空", "q": "15. ____是 20 世纪 20 年代后活跃在英国乐坛上的重要作曲家，他为业余爱好者和青少年写了很多优秀作品，其中有著名的《青少年管弦乐队指南》等。", "a": "布里顿"}, {"id": 244, "ch": "第七章", "type": "填空", "q": "16. 20 世纪的美国作曲家格罗菲因在 1924 年为格什温的《蓝色狂想曲》配器而一举成名，其管弦乐作品____奠定了他在音乐史上的重要地位。", "a": "《大峡谷组曲》"}, {"id": 245, "ch": "第七章", "type": "填空", "q": "17. 辟斯顿作为音乐理论家、哈佛大学的教授，在音乐理论方面取得了令人瞩目的成就，著有____、____和____等，这些著作具有广泛影响，为美国乃至世界音乐教育做出了重要贡献。", "a": "《和声分析原理》、《和声学》、《对位法》（或《配器法》）"}, {"id": 246, "ch": "第七章", "type": "填空", "q": "18. 俄罗斯作曲家肖斯塔科维奇虽经受了数次政治风波打击，却始终真诚直率地面对生活、面对创作，其____部交响乐和____部弦乐四重奏正是他直面人生的明镜，这些作品也使他无可争议地成为 20 世纪最伟大的音乐家。", "a": "15、15"}, {"id": 247, "ch": "第七章", "type": "填空", "q": "19. 微分音音乐是 20 世纪 20 年代兴起的一种音乐风格，系统地进行微分音音乐创作的是捷克作曲家____。", "a": "哈巴"}, {"id": 248, "ch": "第七章", "type": "填空", "q": "20. 序列音乐是 20 世纪 50 年代在十二音音乐基础上发展起来的一种音乐风格，第一首真正的序列音乐作品一般被认为是梅西安于 1949 年创作的钢琴曲____。1953 年起，他又以鸟鸣为元素进行研究，创作了钢琴与管弦乐____，奠定了序列音乐发展的基础。", "a": "《时值和力度的模式》、《异国鸟》"}, {"id": 249, "ch": "第七章", "type": "填空", "q": "21. 20 世纪法国作曲家布列兹最著名的作品是为女低音和 6 件乐器而作的作品____，它是整体序列音乐的经典之作。", "a": "《无主的锤子》"}, {"id": 250, "ch": "第七章", "type": "填空", "q": "22. 偶然音乐是 20 世纪____年代之后兴起的一种音乐风格，这种音乐与严格控制的序列音乐相反，创始人为美国作曲家____。", "a": "50、凯奇"}, {"id": 251, "ch": "第七章", "type": "填空", "q": "23. 20 世纪美国作曲家____从印度禅宗哲学以及中国《易经》中吸取养分，对偶然音乐进行了探索，创作了著名的无声钢琴音乐作品____等，该作品反映了他的艺术理念：生活就是音乐，音乐就是生活。", "a": "凯奇、《4 分 33 秒》"}, {"id": 252, "ch": "第七章", "type": "填空", "q": "24. 电子音乐是 20 世纪 50 年代产生的一种新音乐形式，其发展可分为三个阶段：一是____音乐与具体音乐时期，二是____音乐时期，三是____音乐时期。", "a": "录音带、电子合成器、电子计算机"}, {"id": 253, "ch": "第七章", "type": "填空", "q": "25. 早期电子音乐的倡导者是 1948 年在法国国家广播电台首创电子音乐实验室的法国音响工程师____与作曲家____，以及 1951 年在德国科隆广播电台建立电子音乐工作室的德国音乐家____。", "a": "谢菲尔、亨利、艾默特"}, {"id": 254, "ch": "第七章", "type": "填空", "q": "26. 德国电子音乐家____通过为童声女高音和电子音响而作的作品____，使法国的具体音乐和德国的电子音乐于 60 年代左右逐渐走到了一起，使他成为 20 世纪最重要的电子音乐作曲家。", "a": "施托克豪森、《青年之歌》"}, {"id": 255, "ch": "第七章", "type": "填空", "q": "27. 1945 年后，音乐创作中出现了一种转向寻找新音色的现象，主要使用传统乐器进行演奏，通过新的演奏方法开拓新的音响资源，与电子音乐分别走上了新音色探索的两条不同道路，新音色方面的代表作品有波兰作曲家____的《广岛受难者的挽歌》和匈牙利作曲家____的《大气》。", "a": "彭德雷茨基、利盖蒂"}, {"id": 256, "ch": "第七章", "type": "填空", "q": "28. 20 世纪作曲家____是美国新音色音乐和音乐神秘主义的主要代表，其扩声钢琴作品《大宇宙》（系列）是他的代表作品之一。", "a": "克拉姆"}, {"id": 257, "ch": "第七章", "type": "简述题", "q": "30. expressionism", "a": "原书答案指向：第七章，第五题"}, {"id": 258, "ch": "第七章", "type": "简述题", "q": "31. twelve-note system 或 zwolftonmusik", "a": "原书答案指向：第七章，第九题"}, {"id": 259, "ch": "第七章", "type": "简述题", "q": "32. Neo-classicism", "a": "原书答案指向：第七章，第十题"}, {"id": 260, "ch": "第七章", "type": "简述题", "q": "33. microtone", "a": "原书答案指向：第七章，第三十六题"}, {"id": 261, "ch": "第七章", "type": "简述题", "q": "34. music of noise", "a": "原书答案指向：第七章，第三十七题"}, {"id": 262, "ch": "第七章", "type": "简述题", "q": "35. serialism music", "a": "原书答案指向：第七章，第三十九题"}, {"id": 263, "ch": "第七章", "type": "简述题", "q": "36. chance music", "a": "原书答案指向：第七章，第四十二题"}, {"id": 264, "ch": "第七章", "type": "简述题", "q": "37. electronic music", "a": "原书答案指向：第七章，第四十四题"}, {"id": 265, "ch": "第七章", "type": "简述题", "q": "38. minimal music", "a": "原书答案指向：第七章，第五十三题"}, {"id": 266, "ch": "第七章", "type":
