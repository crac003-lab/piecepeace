d": 330, "ch": "第七章", "type": "简述题", "q": "104. 简述彭德雷茨基的艺术成就。", "a": "原书答案指向：第七章，第四十五题第 1、3 点"}, {"id": 331, "ch": "第七章", "type": "简述题", "q": "105. 简述利盖蒂的艺术成就。", "a": "原书答案指向：第七章，第四十七题第 1、3 点"}, {"id": 332, "ch": "第七章", "type": "简述题", "q": "106. 简述诺诺的艺术成就。", "a": "原书答案指向：第七章，第四十八题第 1、3 点"}, {"id": 333, "ch": "第七章", "type": "简述题", "q": "107. 简述贝里奥的艺术成就。", "a": "原书答案指向：第七章，第四十九题第 1、3 点"}, {"id": 334, "ch": "第七章", "type": "简述题", "q": "108. 简述克拉姆的艺术贡献。", "a": "原书答案指向：第七章，第五十题第 1、3 点"}, {"id": 335, "ch": "第七章", "type": "简述题", "q": "109. 简述亨策的艺术成就。", "a": "原书答案指向：第七章，第五十一题第 1、3 点"}, {"id": 336, "ch": "第七章", "type": "简述题", "q": "110. 简述勋伯格与第二维也纳乐派各成员的艺术关联（试题集末尾\"第五十二题第 1、3 点\"对应项）。", "a": "原书答案指向：第七章，第五十二题第 1、3 点"}, {"id": 337, "ch": "第一章·笔记自测", "type": "自测", "q": "古希腊音乐常以哪\"三位一体\"的综合艺术形式出现？字母还是纽姆谱记谱？", "a": "诗、舞、乐\"三位一体\"；用字母记谱。"}, {"id": 338, "ch": "第一章·笔记自测", "type": "自测", "q": "填空：悲剧在希腊文中意为____，起源于对酒神____的敬仰。", "a": "山羊之歌；狄俄尼索斯。"}, {"id": 339, "ch": "第一章·笔记自测", "type": "自测", "q": "写出三大悲剧作家及其各一部代表作品。", "a": "埃斯库罗斯《被缚的普罗米修斯》（或《俄瑞斯忒亚》）；索福克勒斯《俄狄浦斯王》（或《安提戈涅》）；欧里庇得斯《美狄亚》（或《特洛伊妇女》）。"}, {"id": 340, "ch": "第一章·笔记自测", "type": "自测", "q": "填空：毕达哥拉斯认为弦长比2:1为____，3:2为____，4:3为____。", "a": "八度；五度；四度。"}, {"id": 341, "ch": "第一章·笔记自测", "type": "自测", "q": "柏拉图与亚里士多德音乐思想的共同点是什么？各举一部著作。", "a": "都强调音乐的教化/道德教育作用而非娱乐。柏拉图《理想国》《法律篇》；亚里士多德《政治学》。"}, {"id": 342, "ch": "第一章·笔记自测", "type": "自测", "q": "填空：\"四音音列\"和完整音列体系由____提出，载于其著作《____》。", "a": "阿里斯多塞诺斯；《和谐的要素》。"}, {"id": 343, "ch": "第一章·笔记自测", "type": "自测", "q": "简答：为什么说古罗马既是古希腊音乐财富的继承者又是发展者？", "a": "继承：征服希腊后继承其音乐传统；发展：实用性上军乐与铜管乐器（大号）发展，享乐性上以水压风琴（最早管风琴）为角斗伴奏。"}, {"id": 344, "ch": "第一章·笔记自测", "type": "自测", "q": "填空：公元____年颁布《米兰敕令》，使基督教成为合法宗教。", "a": "313。"}, {"id": 345, "ch": "第一章·笔记自测", "type": "自测", "q": "简答：古希腊、古罗马音乐对西方音乐的贡献主要有哪些方面？", "a": "①孕育西方音乐源头；②\"三位一体\"综合艺术为歌剧舞剧提供蓝本；③柏拉图、亚里士多德奠定音乐美学基础；④音乐理论与调式成为中世纪教会调式前身；⑤《米兰敕令》开启基督教音乐文化。"}, {"id": 346, "ch": "第一章·笔记自测", "type": "自测", "q": "古希腊调式伦理说中，多里亚、弗里几亚、副弗里几亚调式分别引起什么情感？", "a": "多里亚：安静而有力量；弗里几亚：狂放、激发热情；副弗里几亚：使人丧失意志。"}, {"id": 347, "ch": "第二章·笔记自测", "type": "自测", "q": "填空：发展初期天主教圣歌五种为拜占庭圣咏、____圣咏、法国圣咏、____圣咏和塞尔特圣咏。", "a": "安布罗斯；莫萨拉比。"}, {"id": 348, "ch": "第二章·笔记自测", "type": "自测", "q": "填空：格里高利圣咏常被称为____或____，其教仪活动分为____和____两大类。", "a": "平歌；素歌；日课；弥撒。"}, {"id": 349, "ch": "第二章·笔记自测", "type": "自测", "q": "简答：格里高利圣咏的基本特征是什么？", "a": "无伴奏纯人声单声部、拉丁文歌词、无明显节拍、建立在教会调式基础上，肃穆节制；歌唱方式有独唱、齐唱、交替唱、应答唱四种。"}, {"id": 350, "ch": "第二章·笔记自测", "type": "自测", "q": "圣咏与歌词搭配的四种类型分别是什么？各举一个特征。", "a": "音节式（一字对一音）、圣咏式（同高度音唱大量歌词）、纽姆式（一字对几音）、花唱式（一字对十几至五六十音，常见于哈利路亚）。"}, {"id": 351, "ch": "第二章·笔记自测", "type": "自测", "q": "填空：教会调式8种形态基本确定于____世纪；1547年____（格拉雷安）新增爱奥尼亚与____两种调式，合为12种。", "a": "11；亨利·罗利斯；伊奥尼亚。"}, {"id": 352, "ch": "第二章·笔记自测", "type": "自测", "q": "什么是\"伪音\"？它有什么意义？", "a": "演唱中遇到增四度时自然升高/降低半音而谱面不显示的处理（musica ficta）；为以后的转调创造了条件。"}, {"id": 353, "ch": "第二章·笔记自测", "type": "自测", "q": "简答：圭多的三大贡献是什么？", "a": "①四线谱（五线谱诞生的基础）；②六声音阶（ut re mi fa sol la，首调唱名法的由来）；③\"圭多手\"（以手指关节代表二十个音助记）。"}, {"id": 354, "ch": "第二章·笔记自测", "type": "自测", "q": "填空：有量记谱法由____在《____》一书中提出；15世纪线谱定型为____线谱并改为白符头。", "a": "弗兰科；《有量歌曲艺术》；五。"}, {"id": 355, "ch": "第二章·笔记自测", "type": "自测", "q": "格里高利圣咏横向扩展的三种形式是什么？各自特点一句话。", "a": "附加段（附加/插入新材料）；继叙咏（哈利路亚花唱段填词后独立）；宗教剧（10世纪末从附加段演变，用方言演出）。"}, {"id": 356, "ch": "第二章·笔记自测", "type": "自测", "q": "填空：最早的复调音乐是____，产生于9世纪法国北部的____；奥尔加农发展的五种形式为平行、平行变体、自由/反向、____式和____。", "a": "奥尔加农；教会学校；花唱（式奥尔加农）；狄斯康特。"}, {"id": 357, "ch": "第二章·笔记自测", "type": "自测", "q": "简答：圣母院乐派的两位代表人物及其成就。", "a": "莱奥南（约1135—1200）：擅长华丽奥尔加农，作《奥尔加农大全》；佩罗坦（约1160—1225）：狄斯康特方面成就突出，作三四声部复调作品。"}, {"id": 358, "ch": "第二章·笔记自测", "type": "自测", "q": "填空：经文歌的前身是____；13世纪最典型的经文歌为____声部，存在\"____\"现象。", "a": "克劳苏拉；三；复歌词。"}, {"id": 359, "ch": "第二章·笔记自测", "type": "自测", "q": "比较法国南方与北方游吟诗人歌曲风格的差异。", "a": "南方（特罗巴多）：分句不明确、旋律优美细腻、节奏复杂自由；北方（特罗维尔）：朴实直率、接近民歌、旋律轮廓分明规整。"}, {"id": 360, "ch": "第二章·笔记自测", "type": "自测", "q": "填空：德国恋诗歌手最具特色的\"巴体歌曲\"结构为____；名歌手等级从低到高为艺徒、学友、歌手、____、____。", "a": "aab；诗人；名家。"}, {"id": 361, "ch": "第二章·笔记自测", "type": "自测", "q": "简答：如何从场所、演唱、调式、乐器四方面区分中世纪世俗音乐与宗教音乐？", "a": "场所：教堂内外；演唱：拉丁文复调圣咏 vs 方言单声即兴；调式：教会调式 vs 多用伊奥尼亚/爱奥尼亚；乐器：仅管风琴（13世纪后）vs 民间一切乐器。"}, {"id": 362, "ch": "第二章·笔记自测", "type": "自测", "q": "填空：维特里著有《____》一书；\"新艺术\"时期通常指____—____年。", "a": "Ars Nova（新艺术）；1300；1450。"}, {"id": 363, "ch": "第二章·笔记自测", "type": "自测", "q": "等节奏经文歌的两个构成要素是什么？", "a": "定旋律音列\"克勒\"（Color）与固定节奏型\"塔列亚\"（Talea）的周期性反复；两者长度不同而形成交叉。"}, {"id": 364, "ch": "第二章·笔记自测", "type": "自测", "q": "简答：马肖的三大贡献及其代表弥撒曲的意义。", "a": "23首法文歌词等节奏经文歌；《圣母弥撒》首次把常规弥撒五段作整体（四声部织体）；世俗复调歌曲（virelai、回旋曲、叙事歌）为创作重心。"}, {"id": 365, "ch": "第二章·笔记自测", "type": "自测", "q": "填空：兰迪尼是14世纪____国盲人音乐家，作品共____首，几乎全为叙事歌；其终止式又称____终止式。", "a": "意；154；si—la—do。"}, {"id": 366, "ch": "第二章·笔记自测", "type": "自测", "q": "简答：中世纪音乐总体上有哪些值得关注的问题？", "a": "①天主教音乐是主流；②西方音乐源头多元（含犹太教与拜占庭东方因素）；③复调诞生改变音乐发展方向；④记谱法完善使\"作曲家诞生\"。"}, {"id": 367, "ch": "第三章·笔记自测", "type": "自测", "q": "\"文艺复兴\"的时间断代和思想实质是什么？", "a": "1430—1600 年；思想实质是人文主义——以人为中心，尊重人、给予人性自由，复兴古希腊艺术。"}, {"id": 368, "ch": "第三章·笔记自测", "type": "自测", "q": "文艺复兴复调音乐发展的四个阶段及代表作曲家？", "a": "勃艮第乐派（杜费、班舒瓦）→佛兰德斯乐派（奥克冈、若斯坎、拉索）→罗马乐派（帕勒斯特里那）→威尼斯乐派（维拉尔特、A. 与 G. 加布里埃利）。"}, {"id": 369, "ch": "第三章·笔记自测", "type": "自测", "q": "杜费弥撒曲写作的三个\"第一次\"是什么？", "a": "第一次将世俗曲调运用到弥撒曲中；第一次将经文歌四声部织体运用到弥撒曲中；第一次在定旋律下方加一个对位的低声部。"}, {"id": 370, "ch": "第三章·笔记自测", "type": "自测", "q": "奥克冈代表性经文歌及其惊人之处？", "a": "《感谢上主》——拥有多达三十六个声部的卡农曲，主题在不同声部回旋 9 次之多。"}, {"id": 371, "ch": "第三章·笔记自测", "type": "自测", "q": "拉索奠定的复调两种写作类型是什么？", "a": "对位化写作（模仿原则为主，一气呵成，代表形式为卡农曲与双重卡农曲）；对位和声化写作（复调织体中使用和弦进行，多终止式，段落分明）。"}, {"id": 372, "ch": "第三章·笔记自测", "type": "自测", "q": "帕勒斯特里那的哪部作品平息了\"复调圣咏之争\"？", "a": "《马尔切洛斯教皇弥撒曲》——证明复调音乐能清楚唱出人们对上帝虔诚的爱。"}, {"id": 373, "ch": "第三章·笔记自测", "type": "自测", "q": "特兰托会议召开的时间、地点及其对音乐的两个针对性方案？", "a": "1545—1563 年，意大利北部特兰托；①排除宗教音乐中不虔诚的世俗内容；②反对圣咏复调中无节制的花唱，提倡单声格里高利圣咏。"}, {"id": 374, "ch": "第三章·笔记自测", "type": "自测", "q": "德国众赞歌的四个特点？", "a": "用德语代替拉丁语；曲调来自圣咏、新填词俗乐和新创作音乐；管风琴伴奏的众人合唱；开始单音音乐后发展为四声部合唱、主旋律在高声部。"}, {"id": 375, "ch": "第三章·笔记自测", "type": "自测", "q": "意大利牧歌三个阶段的年代、手法与代表人物？", "a": "早期 1520—1550（主调、四声部和声式：维拉尔特、韦尔德洛、阿卡代尔特）；中期 1550—1580（对位、半音法、五声部：罗勒、蒙特）；晚期 1580—1620（主调、独唱、戏剧化：马伦齐奥、杰苏阿尔多、蒙特威尔第）。"}, {"id": 376, "ch": "第三章·笔记自测", "type": "自测", "q": "哪部歌集的出版促进了英国牧歌的发展？由谁翻译？", "a": "1588 年由尼古拉斯·杨翻译成英文的《阿尔卑斯山南的音乐》（Musica Transalpina）。"}, {"id": 377, "ch": "第三章·笔记自测", "type": "自测", "q": "16 世纪独立器乐体裁分哪三类？各举两例。", "a": "从舞曲中脱颖而出的（帕凡、加亚尔德、阿勒曼德、库朗特）；从声乐中脱颖而出的（利切卡尔源于经文歌、坎佐纳源于尚松）；技巧性体裁（幻想曲、前奏曲、托卡塔）。"}, {"id": 378, "ch": "第三章·笔记自测", "type": "自测", "q": "比良西科最有价值的方面是什么？", "a": "伴奏部分——常为一连串固定的和弦进行，后来演变成帕萨梅佐等器乐体裁形式中的低音主题。"}, {"id": 379, "ch": "第四章·笔记自测", "type": "自测", "q": "巴罗克时期的时间断代及名称来源？", "a": "1600—1750 年，从第一部歌剧诞生到巴赫去世；\"巴罗克\"源自葡萄牙文，意为不规则的珍珠。"}, {"id": 380, "ch": "第四章·笔记自测", "type": "自测", "q": "什么是通奏低音？它带来了哪些历史性影响？", "a": "作曲家只写旋律和低音，低音旁用数字标出和弦位置，演奏者即兴填充和声（数字低音）。导致和声学的诞生，和声体系促使大小调体系产生，结束教会调式时代；巴罗克也被称为通奏低音时代。"}, {"id": 381, "ch": "第四章·笔记自测", "type": "自测", "q": "歌剧最直接的起源是什么？歌剧最终诞生于何时何地？", "a": "最直接起源是 15 世纪末的幕间剧（Intermedio）；16 世纪末最终产生在意大利的佛罗伦萨（巴尔第、柯尔西沙龙聚会）。"}, {"id": 382, "ch": "第四章·笔记自测", "type": "自测", "q": "通常被视为最早歌剧的作品是什么？第一部真正意义上的歌剧是什么？", "a": "1600 年利努契尼脚本、佩里与卡契尼作曲的《优丽狄茜》；蒙特威尔第 1607 年的《奥菲欧》。"}, {"id": 383, "ch": "第四章·笔记自测", "type": "自测", "q": "第一个歌剧院何时何地建立？意义何在？", "a": "1637 年威尼斯圣卡西亚诺歌剧院，使歌剧从贵族沙龙和宫廷走向市民阶层。"}, {"id": 384, "ch": "第四章·笔记自测", "type": "自测", "q": "正歌剧的特点有哪些？", "a": "取材古代神话历史传说、内容严肃；三幕结构、幕间剧；快-慢-快序曲；宣叙调与返始咏叹调交替；极少重唱合唱、不用舞蹈；干念式与带伴奏两种宣叙调。"}, {"id": 385, "ch": "第四章·笔记自测", "type": "自测", "q": "法国抒情悲剧与意大利歌剧的主要区别？", "a": "序曲慢-快-慢；宣叙调带歌唱性、咏叹调带朗诵性、不突出对比；插入芭蕾舞场面、重视合唱与管弦乐；旋律受舞曲影响、音域宽、乐句方整；不用阉人歌手。"}, {"id": 386, "ch": "第四章·笔记自测", "type": "自测", "q": "清唱剧与歌剧的区别？第一部清唱剧是什么？", "a": "清唱剧只唱不演、无动作表演和布景、内容以《圣经》题材为主；第一部是 1600 年卡瓦莱里的《灵与肉的体现》。"}, {"id": 387, "ch": "第四章·笔记自测", "type": "自测", "q": "受难乐发展的三个阶段？", "a": "14 世纪后半叶\"素歌受难乐\"→15 世纪起复调的\"应答受难乐\"→1650 年后借鉴清唱剧与歌剧写法、用众赞歌音调的\"受难清唱剧\"。"}, {"id": 388, "ch": "第四章·笔记自测", "type": "自测", "q": "教堂奏鸣曲与室内奏鸣曲的区别及各自的前身意义？", "a": "教堂奏鸣曲严肃，慢-快-慢-快四乐章，宗教场合，是古典奏鸣曲的前身；室内奏鸣曲世俗性、舞曲风格，是古典组曲的前身。"}, {"id": 389, "ch": "第四章·笔记自测", "type": "自测", "q": "协奏曲的三种类型及代表人物？", "a": "大协奏曲（托雷利确立，巴赫《勃兰登堡协奏曲》最伟大）；乐队协奏曲（托雷利确立，后融入早期交响曲）；独奏协奏曲（托雷利 1698 年奠定，维瓦尔迪《四季》）。"}, {"id": 390, "ch": "第四章·笔记自测", "type": "自测", "q": "古组曲由哪四种舞曲组成？各自的国籍与性格？", "a": "阿勒曼德（德国，中速庄重、四拍子）、库朗特（法国，较快活泼、3/2·3/4 拍）、萨拉班德（西班牙，缓慢庄重、三拍子切分）、基格（英国，急速活泼、6/8·12/8 拍）；同一调性，速度慢-快-更慢-更快。"}, {"id": 391, "ch": "第四章·笔记自测", "type": "自测", "q": "蒙特威尔第\"两种常规\"思想的内容？", "a": "第一常规（prima prattica）即文艺复兴复调传统，\"和声是歌词的主人\"，形式第一；第二常规（seconda prattica）是他自己的新手法，\"歌词应成为和声的主人\"，内容第一。"}, {"id": 392, "ch": "第四章·笔记自测", "type": "自测", "q": "A. 斯卡拉蒂对歌剧的四大贡献？", "a": "那不勒斯乐派创始人；首创返始咏叹调、干念式宣叙调和带伴奏的宣叙调；确立快-慢-快三段序曲（交响曲先声）；创用弦乐四声部加双簧管、大管、小号、圆号的编制。"}, {"id": 393, "ch": "第四章·笔记自测", "type": "自测", "q": "科雷利在弦乐艺术领域的贡献？", "a": "第一个职业小提琴家，确立统一弓法；明确大协奏曲乐队编制（小乐器组为三重奏鸣曲格式）；第一个完全用大小调体系创作的作曲家；《福利亚变奏曲》是最早的小提琴弓法大全。"}, {"id": 394, "ch": "第四章·笔记自测", "type": "自测", "q": "塔蒂尼发现的\"合成音\"是什么？", "a": "1714 年发现\"第三音\"（terzo suono）：差音频率为两音之差（塔蒂尼发现），合音频率为两音之和（黑尔姆霍茨解释）；均以纯律为准；另作《魔鬼的颤音》。"}, {"id": 395, "ch": "第四章·笔记自测", "type": "自测", "q": "拉莫在音乐理论上的贡献？", "a": "1722 年发表《和声学》，奠定近代和声学理论：和弦以泛音为基础，扩展七、九、十一和弦；提出\"基础低音\"概念与转位和弦结构；确认主、属、下属音在和弦中的支柱关系。"}, {"id": 396, "ch": "第四章·笔记自测", "type": "自测", "q": "华丽风格与洛可可艺术的关系？代表人物？", "a": "18 世纪 20 年代法国宫廷美学（洛可可艺术，绘画奠基人华多）在古钢琴音乐中的对应——典雅、细腻、精美、灵巧；代表人物库普兰；华丽风格是古典主义音乐风格的先声。"}, {"id": 397, "ch": "第四章·笔记自测", "type": "自测", "q": "巴赫创作分哪三个时期？各期重要作品？", "a": "魏玛时期（被推崇为大师）；柯登时期（《勃兰登堡协奏曲》、《平均律》第一册）；莱比锡时期（27 年，《马太受难曲》《约翰受难曲》《平均律》第二册）。"}, {"id": 398, "ch": "第四章·笔记自测", "type": "自测", "q": "巴赫的五项艺术成就？", "a": "①《平均律钢琴曲集》首次全面系统运用十二平均律；②复调技巧登峰造极，《音乐的奉献》《赋格的艺术》为总结之作；③复调思维与主调手法并用，继往开来；④钢琴协奏曲奠基者、解放大拇指；⑤使巴罗克器乐发展到顶峰。"}, {"id": 399, "ch": "第四章·笔记自测", "type": "自测", "q": "亨德尔最著名的三部清唱剧？其《弥赛亚》何时何地首演？", "a": "《以色列人在埃及》《弥赛亚》《参孙》；《弥赛亚》1742 年首演于都柏林。"}, {"id": 400, "ch": "第四章·笔记自测", "type": "自测", "q": "巴罗克音乐与以往音乐相比有哪些不同？", "a": "①复调最高峰、通奏低音应用；②大小调体系代替教会调式、复调向主调过渡；③歌剧诞生与器乐凸显，德国音乐强势上升；④教堂音乐绝对地位瓦解，走向宫廷与世俗；⑤音乐家专业化、分工更细。"}, {"id": 401, "ch": "第五章·笔记自测", "type": "自测", "q": "1. 西方音乐古典主义时期的时间范围是什么？包括哪些乐派？", "a": "1750—1820 年；包括曼海姆乐派、柏林乐派和维也纳古典乐派。"}, {"id": 402, "ch": "第五章·笔记自测", "type": "自测", "q": "2. 古典主义音乐与巴罗克音乐在织体和旋律上的根本区别是什么？", "a": "巴罗克以复调音乐为主、旋律延绵不断；古典主义采用主调音乐形式，建立功能和声进行，旋律为短小对称的方整型乐句。"}, {"id": 403, "ch": "第五章·笔记自测", "type": "自测", "q": "3. 格鲁克歌剧改革的核心主张是什么？", "a": "音乐服从诗和剧情，戏剧内容阐释是第一要素；放弃返始咏叹调，序曲纳入歌剧，管弦乐参与剧情表达，加强乐队与合唱作用。"}, {"id": 404, "ch": "第五章·笔记自测", "type": "自测", "q": "4. \"喜歌剧之争\"因何而起、焦点何在？", "a": "1752 年意大利喜歌剧团在巴黎演出《女仆做夫人》引起争论；焦点是提倡平民文化还是弘扬贵族文化，最终导致法国喜歌剧诞生。"}, {"id": 405, "ch": "第五章·笔记自测", "type": "自测", "q": "5. 弦乐四重奏由哪些乐器组成？确立其形式的关键作曲家是谁？", "a": "第一小提琴、第二小提琴、中提琴、大提琴；里赫特是最早运用者之一，海顿最终确立（作有 84 首）。"}, {"id": 406, "ch": "第五章·笔记自测", "type": "自测", "q": "6. 莫扎特协奏曲的第一乐章有哪些典型特征？", "a": "快板奏鸣曲式，双呈示部（乐队先奏第一呈示部，独奏与乐队协同奏第二呈示部），再现部结束前有华彩段。"}, {"id": 407, "ch": "第五章·笔记自测", "type": "自测", "q": "7. 交响曲的起源是什么？曼海姆乐派的结构贡献是什么？", "a": "起源是巴罗克意大利歌剧序曲（sinfonia）的快—慢—快结构；曼海姆乐派加入快速第四乐章，形成快板—行板—小步舞曲—快板终曲的四乐章套曲。"}, {"id": 408, "ch": "第五章·笔记自测", "type": "自测", "q": "8. 贝多芬在交响曲发展上的创新有哪些？", "a": "浓缩动机扩展；扩充展开部；从第三交响曲起以谐谑曲取代小步舞曲作为第三乐章；第九交响曲引入人声。"}, {"id": 409, "ch": "第五章·笔记自测", "type": "自测", "q": "9. 被誉为音乐\"新约全书\"的是哪部作品集？与哪部作品\"齐名\"？", "a": "贝多芬 32 首钢琴奏鸣曲；与巴赫《十二平均律钢琴曲集》齐名。"}, {"id": 410, "ch": "第五章·笔记自测", "type": "自测", "q": "10. C. P. E. 巴赫对奏鸣曲发展的贡献是什么？", "a": "确立了近代（古典）独奏奏鸣曲的四乐章结构形式：快板奏鸣曲式、慢板三部曲式、小步舞曲或谐谑曲、快板回旋曲式。"}, {"id": 411, "ch": "第六章·笔记自测", "type": "自测", "q": "1. 浪漫主义时期的四个阶段及代表作曲家？", "a": "初期（威伯、舒伯特、贝多芬晚期）；中期/盛期（柏辽兹、舒曼、门德尔松、肖邦）；中后期（李斯特、瓦格纳、勃拉姆斯、弗兰克、柴科夫斯基）；晚期（布鲁克纳、普契尼、沃尔夫、马勒、理查·施特劳斯）。"}, {"id": 412, "ch": "第六章·笔记自测", "type": "自测", "q": "2. 瓦格纳的\"整体艺术\"\"乐剧\"\"无终旋律\"\"主导动机\"分别指什么？", "a": "整体艺术：仿古希腊艺术的诗歌、音乐、舞蹈、绘画、建筑综合体（见《未来艺术作品》）；乐剧：1848 年《罗恩格林》后瓦格纳指代其歌剧的称谓；无终旋律：音乐不停顿向前发展、取消分曲结构；主导动机：象征特定人物/事件/情景并与剧情联系的音乐片段，1877 年沃尔错根研究后得名。"}, {"id": 413, "ch": "第六章·笔记自测", "type": "自测", "q": "3. 法国大歌剧与轻歌剧的区别？", "a": "大歌剧：四五幕严肃歌剧，历史题材，奢华舞台与芭蕾，大合唱大乐队，代表迈耶贝尔；轻歌剧：生活气息强、说白代替宣叙调、结构短小多独幕，代表奥芬巴赫。"}, {"id": 414, "ch": "第六章·笔记自测", "type": "自测", "q": "4. 《卡门》的体裁结构与艺术特征？", "a": "传统分曲结构，借鉴瓦格纳主导动机手法，用西班牙音调刻画人物（《哈巴涅拉》《斗牛士之歌》），现实主义倾向，1875 年首演，法国歌剧里程碑。"}, {"id": 415, "ch": "第六章·笔记自测", "type": "自测", "q": "5. 舒伯特为何被誉为\"艺术歌曲之王\"？其三部声乐套曲是？", "a": "他把诗歌、曲调、伴奏融为一体，旋律为歌词内涵的自然流露，伴奏承载演唱难以表达的内容，通过调性、音区、和声色彩变化赋予艺术歌曲新生命；《美丽的磨坊女》《冬之旅》《天鹅之歌》。"}, {"id": 416, "ch": "第六章·笔记自测", "type": "自测", "q": "6. 门德尔松的三大艺术成就？", "a": "首创《无词歌》并对标题交响乐做出贡献（《仲夏夜之梦》序曲、《苏格兰》《意大利》交响曲）；重演巴赫《马太受难乐》使人们重新认识巴赫；创办德国第一所音乐学院——莱比锡音乐学院。"}, {"id": 417, "ch": "第六章·笔记自测", "type": "自测", "q": "7. 舒曼的音乐评论贡献是什么？", "a": "1834 年创建《音乐时报》和\"大卫同盟\"组织，宣扬浪漫主义观念，抨击墨守陈规，推荐肖邦、勃拉姆斯等\"千里马\"，是乐坛的\"伯乐\"。"}, {"id": 418, "ch": "第六章·笔记自测", "type": "自测", "q": "8. 肖邦各类钢琴作品的数量及\"自由节奏\"含义？", "a": "21 首夜曲、27 首练习曲、24 首前奏曲、19 首波洛乃兹、4 首叙事曲、4 首谐谑曲、3 首奏鸣曲、4 首即兴曲、17 首圆舞曲、58 首玛祖卡、2 首幻想曲、2 首协奏曲；tempo rubato 指右手演奏在左手演奏的节奏型内作句法松紧处理。"}, {"id": 419, "ch": "第六章·笔记自测", "type": "自测", "q": "9. \"强力集团\"是哪五人？各自的代表作？", "a": "巴拉基列夫（《塔玛拉》）、穆索尔斯基（《荒山之夜》《图画展览会》《跳蚤之歌》）、李姆斯基-科萨科夫（《金鸡》《舍赫拉查达》）、鲍罗丁（《在中亚细亚草原上》《伊戈尔王》）、居伊（《威廉·拉特克里夫》）。"}, {"id": 420, "ch": "第六章·笔记自测", "type": "自测", "q": "10. 马勒《大地之歌》为何与中国有关？", "a": "歌词采用李白、孟浩然、王维等唐朝诗人的七首诗，六个乐章交替由男高音和女低音/男中音独唱，借用唐诗寄托凄凉落魄的情感，揭示尽情享乐与预感死亡的矛盾。"}, {"id": 421, "ch": "第六章·笔记自测", "type": "自测", "q": "11. 斯美塔那与德沃夏克的三大差异？", "a": "题材：前者捷克本土，后者整个斯拉夫民族；体裁：前者集中歌剧与交响诗，后者交响曲、协奏曲、室内乐、舞曲皆有建树；风格：前者捷克乡土风情浓郁，后者广泛吸收斯拉夫与欧美语言、更多样化。"}, {"id": 422, "ch": "第六章·笔记自测", "type": "自测", "q": "12. 李斯特首创的体裁及其意义？", "a": "交响诗（symphonic poem）：单乐章乐队作品，按奏鸣曲式原则自由发挥，多以文学作品为题材、采用标题音乐形式；单乐章结构和主题变形手法对后世影响极大。"}, {"id": 423, "ch": "第六章·笔记自测", "type": "自测", "q": "13. 谁被称为\"俄罗斯音乐之父\"？其名言是什么？", "a": "格林卡；名言：\"创作音乐的是人民，作曲家只不过是把它编一下而已。\""}, {"id": 424, "ch": "第六章·笔记自测", "type": "自测", "q": "14. 理查·施特劳斯哪些作品与哲学有关？阐述了什么理念？", "a": "《英雄生涯》《查拉图斯特拉如是说》《死与净化》；阐述尼采的\"超人\"理念和英雄主义精神。"}, {"id": 425, "ch": "第七章·笔记自测", "type": "自测", "q": "印象主义音乐的特征有哪些？代表人物与作品？", "a": "以自然景物或诗歌绘画为题材，表达瞬间印象，意境神秘飘忽朦胧；不以旋律为主，重视和声与配器的色彩作用；突破大小调体系，用全音音阶和五声音阶；用九、十一、十三和弦；减弱和声功能、模糊调性；多用小型体裁。代表：德彪西《牧神午后》《夜曲》《大海》《意象集》《前奏曲》；拉威尔《达芙妮斯与赫洛埃》《鹅妈妈》《西班牙狂想曲》《波莱罗》。"}, {"id": 426, "ch": "第七章·笔记自测", "type": "自测", "q": "德彪西受哪些因素影响而走上个性化创作道路？", "a": "受马拉美等象征派作家诗人影响；1889年巴黎国际博览会上从爪哇加美兰乐队演奏中获得新音响灵感；受穆索尔斯基独创性音乐的启发；称颂瓦格纳但认为其道路独一无二、不适用于他人。"}, {"id": 427, "ch": "第七章·笔记自测", "type": "自测", "q": "表现主义音乐的来源与音乐特征？", "a": "20世纪初一战前在德奥兴起，作为印象主义的反义词先出现在德国绘画诗歌领域（康定斯基为代表），1918年蒂森借以评论音乐。特征：反传统——旋律无连贯性、节拍无规律、力度极端变化、和弦尖锐不谐和、结构不明确，最重要的是运用十二音体系；放弃对周围世界的描绘，直接表达内心体验与内在灵魂。"}, {"id": 428, "ch": "第七章·笔记自测", "type": "自测", "q": "勋伯格创作的三个阶段及各阶段代表作？", "a": "①晚期浪漫主义时期（1897—1908）：《净化之夜》、交响诗《佩里亚斯与梅丽桑德》；②无调性时期（1908—1922）：《3首钢琴曲》、歌剧《期待》、《月迷彼埃罗》；③十二音时期（1923—1951）：《钢琴组曲》、《乐队变奏曲》、《一个华沙幸存者》。"}, {"id": 429, "ch": "第七章·笔记自测", "type": "自测", "q": "十二音音乐的基本原则与写作规则是什么？", "a": "原则：十二个半音地位平等，取消大小调体系的音级功能差别。音列以原型P、逆行R、倒影I、逆行倒影RI为基本材料（48种音高序列）。规则：每音须在其余11音出现后方可重复；避免三和弦进行；四度、五度、三全音尽量只用一次；序列中不过多使用相同音程。"}, {"id": 430, "ch": "第七章·笔记自测", "type": "自测", "q": "为什么说韦伯恩的音乐\"为整体序列指明了方向\"？", "a": "他在十二音音乐中除对音高加以组织外，还对时值、力度、节奏、织体、音色等要素作相应安排（如《交响曲》）；其高度浓缩、格言式的语言（最短作品仅约19秒）影响点描音乐形成、确立音色音乐地位。"}, {"id": 431, "ch": "第七章·笔记自测", "type": "自测", "q": "新古典主义音乐的起因、标志与美学主张？", "a": "起因：一战后希望复古；晚期浪漫主义感情表现走到极点；直接起因是布索尼1920年公开信《新的古典主义》。标志：斯特拉文斯基1920年《浦契涅拉》。主张：\"返回巴赫\"、自律论、\"音乐就是音乐\"的绝对音乐，追求均衡稳定理性，反对标题音乐，复兴巴罗克体裁，提倡小型室内化乐队编制。"}, {"id": 432, "ch": "第七章·笔记自测", "type": "自测", "q": "斯特拉文斯基的三个创作时期及代表作？", "a": "①俄罗斯风格时期（至1920年前）：《火鸟》《彼得鲁什卡》《春之祭》；②新古典主义时期（1920—1951）：《浦契涅拉》至歌剧《浪子历程》；③序列主义时期（1951—1971）：《哀歌》《安魂圣咏》。"}, {"id": 433, "ch": "第七章·笔记自测", "type": "自测", "q": "欣德米特作为理论家的主要观点与著述？", "a": "著《作曲指南》《论西方的三种和声体系》，创造个性化和声体系；反对无调性，认为其违反\"类似地球引力那样的力量\"、没有中心点；和弦可由三、四、五度等音程构成，但序进须有法规，必须赋予调性形式，使音乐发展具有逻辑性。"}, {"id": 434, "ch": "第七章·笔记自测", "type": "自测", "q": "\"六人团\"的由来及三位核心人物的风格特点？", "a": "1917年后六位法国青年以\"新青年\"名义举行音乐会，1920年评论家亨利·科莱撰文使名称流传：奥里克、迪雷、奥涅格、米约、普朗克、泰莱菲雷。核心三人：奥涅格（巴罗克式复调、音乐始终有调性、《太平洋231》《火刑堆上的贞德》）；米约（多调性、南美节奏、《屋顶上的公牛》）；普朗克（调性为主、旋律性强、优美诙谐）。"}, {"id": 435, "ch": "第七章·笔记自测", "type": "自测", "q": "20世纪新民族主义与19世纪民族主义音乐的三点不同？", "a": "①内容表达：歌颂笔调减弱，更关注民间音乐本身的内涵与新发现；②素材处理：由抓住民间素材个性按传统完整性处理，转为按民间调式、音阶、节奏写作；③技法吸取：由受浪漫主义影响转为或多或少受新作曲技术影响。"}, {"id": 436, "ch": "第七章·笔记自测", "type": "自测", "q": "巴托克在民俗学、教育学、作曲三个领域的成就？", "a": "民俗学：民族音乐学最早奠基人之一，与科达伊采风收集九千多首民歌，发现真正的匈牙利民间音乐是农民音乐；教育学：编订《小宇宙》《献给孩子们》；作曲：创建巴托克音阶、和声拱形结构、不规则节奏组合，代表作《管弦乐协奏曲》《第三钢琴协奏曲》及六首弦乐四重奏。"}, {"id": 437, "ch": "第七章·笔记自测", "type": "自测", "q": "格什温如何沟通通俗音乐与严肃音乐？", "a": "将美国爵士乐素材与古典作曲技法融于一炉，《蓝色狂想曲》以爵士乐为特点架起通俗音乐与传统音乐之间的桥梁，使街头艺术成为严肃作曲家打开流行音乐大门的钥匙，为爵士乐走向世界舞台、进入专业音乐领域起积极作用；另有《一个美国人在巴黎》、歌剧《波吉与贝丝》。"}, {"id": 438, "ch": "第七章·笔记自测", "type": "自测", "q": "肖斯塔科维奇的音乐风格受哪些作曲家影响？", "a": "英勇无畏的个性来自贝多芬，美好崇高的形象来自巴赫，激越的情感来自柴科夫斯基，怪诞讽刺及悲剧性源于马勒，民族主义与穆索尔斯基相关联，现代技法受20世纪新音乐影响；因此其风格难以归属于任何一个流派。15部交响曲与15部弦乐四重奏是其代表；《24首钢琴前奏曲与赋格》是自巴赫以来钢琴复调音乐的典范。"}, {"id": 439, "ch": "第七章·笔记自测", "type": "自测", "q": "微分音音乐的含义与代表人物？", "a": "小于半音的音程（1/4、1/6、1/8音等）称微分音，用微分音创作的音乐即微分音音乐，20世纪20年代兴起。代表：捷克哈巴（1924年在布拉格音乐学院创建微分音音乐系，《第三弦乐四重奏》、歌剧《母亲》）、美国帕奇；此前卡利洛、艾夫斯有过个别实验。"}, {"id": 440, "ch": "第七章·笔记自测", "type": "自测", "q": "噪音音乐（未来主义音乐）的代表人物及主张？", "a": "\"未来主义\"1909年由马里内蒂提出；普拉泰拉在《未来的音乐》（1912）中提出用音乐模仿机器、汽车、飞机、战争声音；卢梭洛1913年发表《噪音的艺术》、发明\"噪音发生器\"、把噪声分六类，代表作《大城市的苏醒》《汽车与飞机相遇》（1921年巴黎演出）。"}, {"id": 441, "ch": "第七章·笔记自测", "type": "自测", "q": "瓦雷兹的创新观念体现在哪里？", "a": "把音乐的\"乐音\"概念扩大到自然界所有\"声音\"范畴，超出十二平均律、超越十二音技法、突破传统乐器演奏范围；作品构思起点不是和声、旋律、曲式而是\"音\"；借助电子设备创作《电子音诗》等，把音色音响提到首位，成为电子音乐发展史的里程碑。代表作还有《电离》《密度21.5》。"}, {"id": 442, "ch": "第七章·笔记自测", "type": "自测", "q": "整体序列音乐与十二音音乐的区别？第一部整体序列作品是什么？", "a": "20世纪20年代勋伯格的十二音音乐仅音高序列化；50年代的整体序列音乐把节奏、力度、音色等也按序列编排，是十二音音乐的拓宽形式。第一部真正的序列音乐作品：梅西昂1949年《时值和力度的模式》；代表还有布列兹《无主的锤子》。"}, {"id": 443, "ch": "第七章·笔记自测", "type": "自测", "q": "偶然音乐的定义及凯奇的代表作品？", "a": "偶然音乐又称机遇音乐，20世纪50年代后兴起，追求音乐的不固定性、即兴表现，让演奏家在表演时即兴参与创作；音源是生活中的一切声音，有时还可能是无声；与严格控制的序列音乐相反。凯奇代表作《4分33秒》《0′00″》《变化音乐》；体现\"生活就是音乐，音乐就是生活\"的理念；追随者费尔德曼、布朗、沃尔夫等称\"纽约乐派\"。"}, {"id": 444, "ch": "第七章·笔记自测", "type": "自测", "q": "电子音乐发展的三个阶段及代表人物作品？", "a": "①录音带音乐与具体音乐时期：1948年谢菲尔与亨利在法国国家广播电台首创实验室，《铁路练习曲》为第一首作品；1951年艾默特在科隆建立工作室；施托克豪森《青年之歌》使法国具体音乐与德国电子音乐合流。②电子合成器时期：1964年合成器问世，萨博特尼克《月亮中的银苹果》。③电子计算机音乐时期：60年代出现，里塞《突变Ⅰ》。"}, {"id": 445, "ch": "第七章·笔记自测", "type": "自测", "q": "施托克豪森《群》的特殊之处？", "a": "为三个乐队与三个指挥而写的传统器乐曲，在内容和形式上拓宽了音乐的表现空间，是20世纪管弦乐领域里程碑式的作品。其《周期》允许演奏者从任何一页开始；《金属》不用乐谱、要求演奏者独居、沉默、挨饿四天后再演奏。"}, {"id": 446, "ch": "第七章·笔记自测", "type": "自测", "q": "彭德雷茨基《广岛受难者的哀歌》为何是音色音乐的典范？", "a": "通过在传统乐器上使用特殊演奏方法——最高极限音、琴马后的弦上奏震音、手指或指尖敲击小提琴面板、在琴马上演奏等，构成新型音乐语言；同时将音响探索与内容表现结合，赋予作品戏剧性结构。"}, {"id": 447, "ch": "第七章·笔记自测", "type": "自测", "q": "\"利盖蒂主义\"的特点是什么？", "a": "以密集音程、声部细分、微型复调为特点；尝试用微分音使音高层次变化和色彩明暗更精细，织体清澈透明；1961年《大气》发展音块作曲手法，标志新音乐在技术和美学上的转折点。"}, {"id": 448, "ch": "第七章·笔记自测", "type": "自测", "q": "简约音乐的特征与代表人物？", "a": "60年代后期出现于美国：用最简单的材料和手段构造作品；在有调性基础上作无休止的重复，通常保持同一节奏型，在有限几个音上作微小变化。代表：赖利《在C音上》、施托克豪森《心境》、莱奇《为十八位音乐家而作的音乐》、格拉斯《爱因斯坦在海滩上》。"}, {"id": 449, "ch": "第七章·笔记自测", "type": "自测", "q": "新浪漫主义是对什么流派的反拨？其代表人物？", "a": "是对50、60年代过于理智和抽象的序列音乐的否定；有调性但不同于\"共性写作\"时期，是浪漫主义和现代主义的结合，重新强调情感表现。代表：意大利贝里奥《交响曲》、美国克拉姆《大宇宙》《夏夜音乐》、德国亨策《雅各布之梦》。"}, {"id": 450, "ch": "第七章·笔记自测", "type": "自测", "q": "\"第三潮流\"音乐的倡导者与主张？", "a": "20世纪50年代由美国作曲家舒勒倡导：主张把西方现代音乐的手法特点与各国流行音乐结合，引用流行音乐的音调或语汇发展现代音乐，最初主要指西方现代音乐与爵士乐的结合，70年代后延伸到与各国流行音乐的融合。代表：加拿大塞蒙兹《大协奏曲》、美国托奈《六组小曲》。"}, {"id": 451, "ch": "第七章·笔记自测", "type": "自测", "q": "贝尔格《小提琴协奏曲》的创作背景与结构特点？", "a": "为纪念马勒遗孀阿尔玛之女曼依（1935年复活节去世）而作，按安魂曲构思完成；贝尔格同年圣诞节前夕去世，此曲成为他本人的安魂曲。是20世纪小提琴协奏曲中第一首运用十二音技法的作品（结合调性）；四个乐章分两大部分：一、二乐章表现\"生\"，三、四乐章表现\"死\"。"}, {"id": 452, "ch": "第七章·笔记自测", "type": "自测", "q": "霍尔斯特《行星组曲》的七个乐章及创作特色？", "a": "受占星学启发，七个乐章以除地球外的七大行星命名：火星——战争使者、金星——和平使者、水星——飞行使者、木星——欢乐使者、土星——老年使者、天王星——魔术师、海王星——神秘主义（合唱队置于舞台边房间内、最后一小节门静静关上）。乐队编制庞大，用管风琴、六声部女声合唱及低音长笛、低音单簧管等。"}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "音乐作品的曲式结构有哪四大类型？其中本教材讲述的重点是哪一类？", "a": "规范化曲式、变体曲式、边缘曲式、自由曲式；重点为规范化曲式，以并列、再现、循环、奏鸣、套曲、变奏六大曲式结构原则为基础讲述。", "id": 453}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "曲式结构图示中，复式曲式与单式曲式的曲式部分分别如何标记？", "a": "复式曲式（主要指复三部曲式）的曲式部分用加框的大写字母依次表示；单式曲式的曲式部分及复式曲式的次级曲式部分用大写字母依次表示（如 A、B）。", "id": 454}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "音乐的形成至少需要哪两个方面的条件？各包含哪些属性？", "a": "\"声音\"条件（音色、音区、力度、表情法等）与\"时间\"条件（节奏、节拍、速度等）。", "id": 455}, {"ch": "曲式·绪论与表现手段", "type": "填空", "q": "填空：节奏型中\"前长后短\"的是____型，\"前短后长\"的是____型。", "a": "顺分型；逆分型。", "id": 456}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "\"阿尔贝蒂低音\"属于哪种节奏型？它作为背景音型持续使用时，音型发生变化往往意味着什么？", "a": "均等型节奏；音型的变化往往意味着结构层次的转换。", "id": 457}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "名词解释：延留型节奏", "a": "主要由强拍或次强拍上的延留音及其在弱拍上的进行而构成的节奏型，与和声延留音密切联系但仅是节奏组合关系；延留的音多具切分效果，使强拍重音期待感落空，改变正常节拍循环，适合表现委婉缠绵、情感细腻的形象。", "id": 458}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "七拍子有哪三种组合形式？", "a": "\"3+2+2\"\"2+3+2\"和\"2+2+3\"。", "id": 459}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "变节拍与移节拍有何区别？", "a": "变节拍是在不改变节拍标记的前提下，强弱拍次序局部按另一种节拍规律转移、过后恢复原状（用重音记号或连线表示）；移节拍则是不改变节拍的固有关系而只移动重拍的位置，通常在某种音型组合反复出现时采用。", "id": 460}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "名词解释：调式与调性", "a": "调式是将一系列音按照某种固定关系组织起来、并以其中一个音为主音所形成的音高体系；调性指调式中主音的音高。如\"C 大调\"中调式为大调式，调性为 C。", "id": 461}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "西欧特种调式又称什么？哪三种调式的主和弦是大三和弦？哪三种是小三和弦？为何洛克利亚调式很少使用？", "a": "又称\"中古调式\"或\"教会调式\"。伊奥尼亚、利底亚、混合利底亚的主和弦为大三和弦（色彩接近大调式）；多利亚、弗里吉亚、爱奥尼亚为小三和弦（色彩接近小调式）；洛克利亚调式主和弦为不稳定的减三和弦，故很少使用。", "id": 462}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "伊奥尼亚、爱奥尼亚调式分别与大、小调式构成相同，但在应用上最关键的区别是什么？", "a": "大、小调式中各音级间有着严格的功能关系，而特种调式中没有。", "id": 463}, {"ch": "曲式·绪论与表现手段", "type": "填空", "q": "填空：我国民族五声调式的五个正音是宫、商、角、____、____；常用的四个偏音是清角、变徵、变宫、____。", "a": "徵、羽；闰（♭si）。五声音阶的特点是没有小二度和三全音。", "id": 464}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "旋律进行方向的三种基本形式是什么？最常见的两种波浪型旋律发展态势是什么？", "a": "平行、上行、下行；\"先上行后下行\"的正波型与\"先下行后上行\"的反波型。", "id": 465}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "级进与跳进如何划分？三度的效果有何特殊性？五声性进行中小三度如何对待？", "a": "大、小二度任何时候都视为级进，四度及以上为跳进；三度处于中间环节，与二度级进比较时具跳进效果，与更大跳进相比则有级进感觉；五声性进行中小三度（角—徵、羽—宫）都可作为级进对待。", "id": 466}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "名词解释：静音环绕型旋律型", "a": "以其中某一音为支柱，其他音在不大的音程范围内环绕其上下、从而使被环绕的音得到强调的旋律型。", "id": 467}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "简答：高潮的形成一般运用哪些手段？", "a": "力度不断增强、音区不断向顶端（最高点或最低点）进行、织体不断增厚、以模进为主的连句式发展等；高潮点的和声一般需较高紧张度，常使用各种不协和和弦。", "id": 468}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "旋律运动的四阶段发展逻辑是什么？三阶段与两阶段逻辑分别是什么？", "a": "四阶段为\"起—承—转—合\"（最完备形式）；相邻阶段融合贯通时合并为三阶段\"起—开—合\"；两阶段为\"呼—应\"（平行乐段为典型）。四阶段是最大限度划分，二阶段是最小限度划分。", "id": 469}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "名词解释：变奏中的装饰变奏与性格变奏", "a": "装饰变奏指在不脱离原始乐思基本性格的条件下对旋律进行加花或简化的变奏；性格变奏指在保留原始乐思总轮廓、旋律运动总布局及结构比例等条件下，通过某种手法使之获得另外一种性格的变奏。", "id": 470}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "迭奏与变奏有哪两方面主要区别？", "a": "①迭奏的变化只发生在局部，变奏则在整个过程中展开；②迭奏中各局部变化方式可同可不同，变奏则强调变化的统一性（变化方法在整个过程中一致）。", "id": 471}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "模进与重复、再现最主要的区别是什么？连续上行与下行的模进各有何效果？", "a": "区别在于模进在重复时发生了整体移位性的音高变化；连续向上的模进易使情绪积累达到高潮，连续向下的模进可使音乐迅速安静并停顿下来。", "id": 472}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "名词解释：溯型手法", "a": "乐思发展时改变旋律进行的方向或音程（也可二者都改变）、但仍保持原始材料节奏型的手法；比模进在音程及进行方向上更自由，但失去了模进特有的动力性因素。", "id": 473}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "简答：出新（对比）手法虽然引入新乐思，但必须与前面乐思保持哪些内在联系？", "a": "音乐基本表现手段和发展手法运用上的一致性、不同乐思之间的连贯性以及音乐格调的统一性等。", "id": 474}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "名词解释：宽放与紧收", "a": "属于重复的两种变体形式，指在相同或相近的节拍中将乐思按某种比例放慢（宽放）或加快（紧收）一倍甚至多倍的再陈述；其最重要特征是在相同或相近的节拍与速度条件下，前后乐思相对应位置上的时值构成一定的倍数关系。宽放使主题稳定有分量、利于形成稳定终止；紧收积累紧张度，适合向高潮推进。", "id": 475}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "合头换尾与合尾换头分别在中西方音乐中的使用情况如何？\"鱼咬尾\"的含义是什么？", "a": "\"合头换尾\"在西方音乐中十分常见（最典型的平行乐段即是）；\"合尾换头\"在中国音乐中用得更多（如《春江花月夜》十一个段落以同一音调结束）。\"鱼咬尾\"指下一个乐思的开始重复前一个乐思的结束，与文学\"顶真格\"修辞相似。", "id": 476}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "简答：补充手法的主要特征与判断依据有哪些？它与扩充的本质区别是什么？", "a": "特征：①内容和情绪与前面乐思保持一致，使用收束性陈述方式；②调性明确并在原调上结束。判断依据：主题音调片断（尤其结束处音调）的重复、主持续音的使用、主属和弦的交替、下属功能和声的强调等。本质区别：扩充发生在终止式之前的结构内部，是乐思内在的有机生长；补充出现在完满终止式之后，是乐思外在的附加或辅助陈述。", "id": 477}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "名词解释：叠入", "a": "两个乐思相继陈述时，前面乐思的结尾与后面乐思的开始发生重叠的现象；多用于音乐各部分的交界处（如引子结束与主题开始），目的是消除两者之间的隔断状态。分析标注时前后两部分都把叠入部分算进去，交界处标注\"叠入\"字样，图示总小节数会超出谱面实际小节数。", "id": 478}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "和声的意义体现在哪三个方面？", "a": "①结构功能（终止式起划分句逗和段落的作用，如半终止与完满终止）；②形象塑造功能（和声的色彩性特征，来自不同结构和弦的音响色彩差别与非功能性进行）；③提供音乐发展动力的功能（和弦音响紧张度的起伏变化推动音乐发展）。", "id": 479}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "多声织体中的复调织体分为哪三种形式？主调织体有哪几种常见形态？", "a": "复调织体分支声复调、对比复调、模仿复调三种；主调织体有持续低音式、柱式和弦式与分解和弦式等。", "id": 480}, {"ch": "曲式·绪论与表现手段", "type": "填空", "q": "填空：演奏（唱）法主要分为____、____与____三种类型；宽广抒情的旋律多用____，轻巧活泼的旋律多用____。", "a": "连奏、断奏、半断（连）奏；连奏；断奏。", "id": 481}, {"ch": "曲式·绪论与表现手段", "type": "简答", "q": "织体在音乐作品中的作用体现在哪两个方面？", "a": "①不同的织体形态总是与特定的体裁风格或形象内容相联系；②织体的变换经常与音乐发展阶段的变化结合起来，可作为音乐结构划分的重要依据（如奏鸣曲式展开部的阶段划分）。", "id": 482}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "音乐语言与文学语言的基本素材如何对应？", "a": "字—乐音；词—乐汇；词组—乐节；句—乐句。各级素材间还可形成上下分级的组合关系。", "id": 483}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "音乐语言的陈述结构与曲式结构有何区别？", "a": "曲式结构是\"宏观\"概念，指作品各组成部分间的相互关系；陈述结构是\"微观\"概念，指每一组成部分内部结构单元的构成方式。二者相辅相成但所指内容完全不同。", "id": 484}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "乐段结构的结构原则是什么？由此可解读出哪三点本质？", "a": "原则：一个有一定量度的乐思发展到某一重要的或突出的半终止，暂时间断停顿后，再相应有机地发展下去，直到最后完全终止。三点本质：①典型乐段由两个乐句构成；②两乐句构成有机统一的整体；③两乐句在终止上具有呼应关系。", "id": 485}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "平行、模进、派生、对比四种乐段的区别是什么？", "a": "平行（重复性/合首）：两乐句以相同材料开始，落音和终止式不同；模进：两乐句为模进或移调关系，结尾常因终止呼应而变化；派生：无明确重复或模进，但第二句明显由第一句发展演变而来；对比：材料和陈述方式对比十分鲜明、找不到明确联系。", "id": 486}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "方整性乐段与规整性乐段如何区分？", "a": "方整性乐段两乐句长度相等且小节数为 2ⁿ（n 为自然数，一般不大于 4），如 4+4、8+8；规整性乐段两乐句长度相等但小节数为除 2 之外的自然数（3、5、6、7、9 等），以每句 5、6 小节较常见。方整性平衡感与稳定感更强。", "id": 487}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "为什么\"前长后短\"型非对称性乐段不太常见？", "a": "因为后句一般至少要承担对整个乐段结构进行总结和收束的功能，缩短易造成\"头重脚轻\"的感觉；因此两乐句长度相差一般只有一小节左右，若相差太大则第二乐句有下降为第一乐句补充的可能，引起整体结构变异。", "id": 488}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "收拢性乐段与开放性乐段各自的定义与适用部位？", "a": "收拢性乐段在单一调性中陈述并以原调完满全终止结束，稳定性与封闭性强，可作独立乐曲的结构基础，也是再现曲式再现部分常用形式；开放性乐段以原调完满全终止之外的其他终止结束（实践中以属和弦最常见），独立性与稳定性降低，不能作独立乐曲的结构基础，也不宜作作品结束部分，多用于开始或中间部分。", "id": 489}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "开放性乐段中间半终止的两种选择及其语气含义？", "a": "①\"先答后问\"：半终止用相对稳定的主功能和弦，与结束终止形成\"稳定—不稳定\"的反相呼应（常降低完满程度，如三音旋律位置）；②\"一问再问\"：半终止用不稳定或更不稳定的和弦，形成\"不稳定—不稳定\"的层次推进。前者语气是\"先答后问\"，后者是\"一问再问\"。", "id": 490}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "转调乐段的调性转换规律与两重性是什么？", "a": "以近关系调为主：大调最常转向属大调（或其关系小调），小调转向关系大调或属调（大、小属调）；浪漫时期后更自由。两重性：以新调完满全终止结束具有一定收拢性，但就主调而言最后的终止又具开放性质，适用范围与开放性乐段基本一致。", "id": 491}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "三个乐句的乐段有哪五种构成方式？哪些较常见？", "a": "aaa、aab、abb、aba、abc 五种；以 aab 和 abb 两种类型较为常见。", "id": 492}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "aba 型三乐句乐段与再现三部曲式的关系如何理解？", "a": "aba 型已具有再现三部曲式的结构特征，但对比与再现发生在乐句而不是曲式部分的层面，因此仍然只能把它作为乐段看待。", "id": 493}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "\"起承转合\"四乐句乐段中各句如何体现功能？", "a": "\"承\"是\"起\"的变化重复；\"转\"在和声上刻意突出下属功能，与前面强调主、属功能形成对比；\"合\"回到与\"起\"相同的起始音高度并综合前面多个材料。同时二分性依然明显：\"承\"与\"合\"以相同的长时值音符结束，一\"属\"一\"主\"遥相呼应。", "id": 494}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "乐句群与多乐句乐段如何区分？", "a": "多乐句乐段仍贯彻乐段的结构原则（有机统一与终止呼应）；乐句群中乐句间关系较为松散，尤其终止上缺乏必要呼应，还可能以延长休止符隔开、断分性强，认定为乐段十分牵强，故称\"乐句群\"。乐句数量没有定数，两个以上即可。", "id": 495}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "复乐段的定义与典型和声安排是什么？", "a": "典型复乐段由两个乐段构成，两乐段关系与单乐段中两乐句关系相同：在内容和情绪统一贯连的发展中，前一乐段结束在各种不稳定的半终止上，后一乐段以完满的终止式相呼应。复乐段之间以平行关系为主，乐段内部乐句之间以对比关系为主。", "id": 496}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "对比复乐段为什么在实际教学中常被排除？它与并列单二部曲式如何区分？", "a": "因为对比复乐段十分少见（常举唯一例子是瓦格纳《唐豪瑟》序曲主题），且与并列单二部曲式高度相似甚至难以区分。区分的唯一结构性依据：并列单二部曲式不要求终止上严格的呼应关系，而复乐段要求前乐段半终止、后乐段完满终止的呼应。", "id": 497}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "乐段群与复乐段的区别是什么？", "a": "乐段群中各乐段关系更自由：不需要主题材料上的明显联系，也不需要终止上的呼应；但因以同一内容表达为基础，各乐段在结构规模、材料运动线条、调性终止变化等表现手段上相当一致。乐段群仍属一部曲式范畴，不构成多部分曲式。", "id": 498}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "连句结构运用哪些发展手法？其中哪两种不可缺少？", "a": "结合重复、模进、裁截、紧收等多种手法，使模进或重复与紧收或裁截相互交替出现；常结合力度、速度手段，还可出现局部变节拍现象。重复和裁截是任何连句结构都不可缺少的。", "id": 499}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "模进结构与\"模进关系的乐段\"有何不同？", "a": "\"模进关系的乐段\"只由两个乐句构成，且终止上要形成乐段所必需的呼应关系；模进结构不受这些条件限制，模进环节的数量、长度（多为乐节或乐句）没有定数，终止上也不需要形成乐段式的呼应关系。", "id": 500}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "自由结构在外部形态上常表现出哪些特征？", "a": "①下属结构单元长短不一、起讫无规律；②局部运用连句或模进结构式的发展；③旋律发展过程中插入非旋律化材料（音阶式走句、固定音型、华彩性陈述）等。", "id": 501}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "六种曲式结构原则分别是什么？", "a": "并列原则、再现原则、循环原则、奏鸣原则、套曲原则、变奏原则。其中并列是一切曲式结构的基础，奏鸣原则被称为最高曲式结构原则。", "id": 502}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "为什么说奏鸣原则是\"再现原则在更高层次上的体现\"？", "a": "因为奏鸣原则中的再现不是静止和原封不动的，而是一种动态的、体现了矛盾解决思维的新水平上的再现——两个调性和形象对比的主题于再现中在主调中实现调性附合。", "id": 503}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "循环原则为什么又称\"多（次）再现原则\"？其最基本曲式至少包括哪几个部分？", "a": "因为同一曲式部分\"再现\"两次或两次以上才能形成\"循环\"。最基本的循环曲式至少包括五个部分：初次呈示—对比—第一次再现—再次对比—第二次再现。", "id": 504}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "四种曲式结构类型是什么？哪些属于\"非规范化曲式\"？", "a": "规范化曲式、变体曲式、边缘曲式、自由曲式；后三种属于\"非规范化曲式\"范畴。边缘曲式是有机融合两种或三种不同结构组合原则的曲式。", "id": 505}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "什么是变奏曲式中的\"附生性原则\"？", "a": "变奏原则本身不是特定的曲式结构原则，而是将变奏段落纳入其他结构原则形成框架；这些依附于变奏原则而存在的并列、再现、循环、奏鸣甚至套曲原则，称为变奏曲式中的附生性原则。", "id": 506}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "单一部曲式的定义是什么？作为独立乐曲与作为多部曲式组成部分时表现特性有何区别？", "a": "单一部曲式是在表达单一音乐形象基础上形成的完整或相对完整的曲式结构，不形成对立的音乐形象、不用过强对比手法。作为独立乐曲时形象揭示过程更富层次性、能体现完善的曲式功能运动；作为多部曲式组成部分时陈述相对简练集中、主题材料不作更多发展，具有明显的阶段性特征。", "id": 507}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "单一部曲式采用的音乐语言陈述结构有哪三种形式？", "a": "①乐段结构及其扩展形式（各种单乐段、复乐段、乐段群）——最主要的形式；②其他陈述结构（模进结构、连句结构、自由结构等）；③由一个乐句构成的单一部曲式（规模常超过一般乐句、形象内容表达相对完整独立）。", "id": 508}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "单一部曲式在调性与和声上分哪两种情况？各自能用在什么部位？", "a": "单一调性且以完满终止结束者完满程度高，可作独立乐曲的结构基础或用于多部曲式相对稳定的部位（如结束部分）；以开放终止结束的单一调性者及转调者稳定性与独立性较弱，不能作独立乐曲的结构基础，只能用于多部曲式的非结束部分（呈示、中间部分等）。", "id": 509}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "为什么说单一部曲式是一切曲式结构形成的基础？", "a": "因为任何一种曲式结构中都不可避免地包含着单一部曲式——无论是并列还是再现的单三部曲式，每一个曲式部分都是一个相对独立的单一部曲式。", "id": 510}, {"ch": "曲式·陈述结构与单一部曲式", "type": "简答", "q": "肖邦《a 小调前奏曲》Op.28 之 2 的结构与调性安排有何特点？", "a": "属用模进结构写成的单一部曲式：模进环节相当于乐句规模（2+3 的两个乐节），先后出现四次；开始调性为属小调 e 小调（非主调），a′ 上五度模进至 b 小调，a″ 首音上四度但音程多变为上（小）三度，a‴ 带特别的\"再现\"关系；直到最后额外添加的终止式处 a 小调的主调意义才真正得到肯定。", "id": 511}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "并列曲式的定义是什么？各并列部分之间存在什么关系？", "a": "以并列原则为基础构成的曲式结构统称并列曲式；所有并列部分地位同等重要，任何部分都不出现明显重复其他部分主题材料的情况，即不包含明确的再现部分；各部分以内在联系为基础，在内容形象与发展上要有连贯性和逻辑性。", "id": 512}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "实践中并列曲式的部分数量如何？为什么？", "a": "并列部分很少超过三个；部分增多会给曲式的完整统一带来困难，实践中以并列二部和并列三部较为常见，超过三部十分少见。", "id": 513}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "并列曲式为何常作为歌曲的结构基础？", "a": "歌词的统一作用能克服段落间因音乐材料对比所造成的缺乏内在联系的问题，歌词所表现的不同形象内容也为并列曲式的形成提供理论和实践依据。", "id": 514}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "并列单二部曲式的第二部分在和声与结构上常表现出什么特征？", "a": "开始常表现不稳定性与活跃性（复杂和声进行、频繁离调），结构上呈零散或片断化特征（连句结构、自由结构）；后半为收束，调性明确、和声趋于稳定。", "id": 515}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "并列单二部曲式的典型调性布局是什么？", "a": "第一部分以主调开始、以近关系调结束（大调转属调、小调转关系大调或属大调多见），第二部分以该调开始，结束前转回主调；也可在单一调性中陈述。", "id": 516}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "\"主歌—副歌\"歌曲对应哪种曲式？两个部分分别对应什么？", "a": "并列单二部曲式；每次都改变歌词的主歌（分节歌）部分为第一部分，采用固定歌词的副歌（叠歌）部分为第二部分。", "id": 517}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "刘炽《我的祖国》A、B 部分用了什么贯穿性发展手法？对比体现在哪些方面？", "a": "两个部分的旋律都运用了\"鱼咬尾\"手法（前句结束音与后句开始音相同）；对比体现在演唱形式（领唱与合唱）、体裁风格（抒情曲与进行曲）、情绪（优美抒情与英勇豪迈）及力度、速度等方面。", "id": 518}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "并列单三部曲式三个部分之间的组合关系有哪三种最常见形式？", "a": "三部分间均等的对比关系、逐渐增加的对比关系、突出中间部分与两端的对比关系。", "id": 519}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "并列单三部曲式没有主题再现，靠什么维持整体结构的平衡？", "a": "靠调性的\"再现\"——第三部分调性通常回到最初的调性；还可通过速度、织体等主题之外的手段强化与（尤其）第一部分的呼应关系。", "id": 520}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "并列单三部曲式附属曲式部分常担负什么结构功能？", "a": "如用相同材料构成引子、间奏和尾声，或在尾声中实现对前面材料的再现或总结，从而加强曲式的完整性和统一性。", "id": 521}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "再现曲式中的\"再现\"与作为音乐发展手法的\"再现\"有何区别？", "a": "再现曲式中的\"再现\"针对的是独立或相对独立的曲式部分（例外不小于完整乐句，仅见于再现单二部曲式），且主题材料陈述虽可能有变化但仍相对明确。", "id": 522}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "\"复合曲式\"的定义是什么？其典型代表是哪种？", "a": "指曲式的组成部分中还可划分出次级曲式部分的曲式结构，即其曲式部分由超过一个（常为两或三个）单式曲式部分联合而成；典型代表是再现复三部曲式，使用频率最高、表现范围最广。", "id": 523}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "再现单二部曲式的定义？其为何虽只两部分却符合再现原则？", "a": "由两个相对独立、规模相等的部分组成，第二部分前半与第一部分对比、后半再现第一部分的前一半或后一半；因第二部分中先后出现\"对比\"和\"再现\"两种结构现象，三阶段音乐发展性质成立，故可视为再现单三部曲式的雏形。", "id": 524}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "再现单二部曲式如何与\"起承转合\"的曲式功能运动对应？", "a": "第一部分前后两半分别担负\"起\"和\"承\"，第二部分对比的前半是\"转\"，第二部分后半的再现实现\"合\"。", "id": 525}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "再现单二部曲式中再现第一部分的哪个乐句更常见？终止式如何处理？", "a": "平行关系结构中多再现第二乐句，对比关系结构中多再现第一乐句；再现须把不适合全曲结束的因素（半终止、转调终止）改造为原调的完满全终止。", "id": 526}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "如何把握\"半再现\"结构要点的规模界限？", "a": "若第二部分对比部分超过第一部分一半的规模但再现仍只有一半，仍属再现单二部曲式；若对比部分仅略超一半而再现部分扩展为相当于整个第一部分，则属再现单三部曲式。", "id": 527}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "原封不动的紧接反复是否影响曲式结构判断？分析时应如何处理？", "a": "不影响；无论是通谱式记法还是反复记号，原封不动的紧接反复都不改变曲式结构，确认时可先将反复部分排除在外，再根据余下结构得出结论。", "id": 528}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "再现单三部曲式的定义及其区别于再现单二部曲式的首要特征是什么？", "a": "由三个相对独立、规模相当的部分组成，第三部分是第一部分的再现，中间部分与两端对比；首要特征是对比与再现上升到完整曲式部分之间（第三部分与第一部分的完整再现关系）。", "id": 529}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "再现单三部曲式中间部分的主题材料运用有哪三种情况？", "a": "①第一部分中材料的展开；②运用新的对比主题；③综合运用展开和对比两种手法。", "id": 530}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "再现单三部曲式中间部分在陈述、和声与调性上的要求是什么？", "a": "多属展开性陈述类型（连句结构、自由结构重要），常伴转调过渡、再现前属准备等附属部分；一般不使用第一部分出现过的主调或从属调性，并避免在任何调性中长时间稳定陈述和终止结束。", "id": 531}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "\"变化再现\"主要涉及哪三个方面？", "a": "①音乐基本表现手段（织体、音区、速度、力度、演奏法）的综合变化；②结构规模的\"扩充\"与\"减缩\"（扩充常综合中间材料并形成高潮，构成动力化再现；减缩多为第一部分整体压缩）；③调性与和声的变化（再现须回主调完满全终止，再现有时从下属调性开始，整体呈 T—D—S—T 布局）。", "id": 532}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "什么是\"动力化再现\"？多见于哪种情况？", "a": "再现时结构扩充并综合音乐表现手段变化及中间部分材料因素，形成最具戏剧性和表情内容丰富、常伴有明显高潮的再现方式；在带有\"插部\"性中部的复三部曲式及戏剧性作品中较多见。", "id": 533}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "再现单三部曲式反复时的典型模式是什么？", "a": "A 部分单独反复，B 部分与 A' 部分一起反复（如海顿《优美的行板》）。", "id": 534}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "复三部曲式的定义？其三个基础部分与次级结构常用什么？", "a": "专指复合再现三部曲式，是再现单三部曲式的扩大形式，三个部分按再现原则组合且至少有一个部分大于单一部曲式；基础部分（一级曲式结构）为首部、中部、再现部，次级结构以单二部或单三部曲式最常见。", "id": 535}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "复三部曲式中部的调性安排有何规律？", "a": "更常见在属方向各调或同主音调，主调为小调时常用关系大调；若首部内部属调已充分展示，中部改用下属方向调性以突出调性功能对比；浪漫时期后更自由，可出现较远关系调性。", "id": 536}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "\"三声中部（Trio）\"名称的由来及其特征？", "a": "源自巴洛克古组曲和大协奏曲中用三件管乐器组成的小组乐器演奏的第二首舞曲；特征为结构完整、段落界线分明、独立程度高、主题清晰稳定、呈示性（非展开性）陈述、常以完满终止收拢并可单独演奏；此类复三部曲式又称\"集成性复三部曲式\"。", "id": 537}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "\"插部\"性中部的典型特征及其与两端部分的连接方式？", "a": "具有展开性特征：结构不完整不独立、段落界限不分明、主题材料散化、和声调性不稳定，不能反复或单独演奏；进入时可能有小连接，退出时与再现部之间十分典型地出现属准备阶段，有时还有\"假再现\"等转折过渡形式。", "id": 538}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "\"动—静—动\"与\"静—动—静\"分别对应哪种类型的复三部曲式？", "a": "\"三声中部\"式复三部曲式为\"动—静—动\"（两端热烈欢快、中部平静稳重）；\"插部\"性中部复三部曲式为\"静—动—静\"（两端缓慢抒情、中部展开富于紧张度与动力性）。", "id": 539}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "判断\"假再现\"需要注意哪三点？", "a": "①必须出现在接近中部结束的位置；②不能在主题原来的调性上；③其后一定要有真正的再现；且假再现中只出现再现部主题的片断，若在别的调性上完整再现则另当别论。", "id": 540}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "复三部曲式再现部的\"减缩再现\"是什么？为何常发生在首部为再现单三部曲式时？", "a": "再现部只再现首部的一部分（通常是次级曲式的开始部分），由单二/单三部曲式减缩为单一部曲式；因首部 ABA 中\"A\"已出现过两次，为避免同一主题过多重复、加速音乐发展而省略。", "id": 541}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "贝多芬《第十五钢琴奏鸣曲》（Op.28）第二乐章的曲式结构要点？", "a": "复三部曲式：首部为再现单三部曲式（减缩再现），中部为再现单二部曲式（同主音大调 D 大调，内部 T—D—S—T 完整调性布局），再现部为简单变化再现（反复时装饰变奏），尾声综合全曲重要素材。", "id": 542}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "贝多芬《第四钢琴奏鸣曲》（Op.7）第二乐章中部的类型及特殊现象？", "a": "中部为典型\"插部性\"中部，在远关系调性中发展插部主题；再现前出现\"假再现\"——首部主题动机在错误调性（♭B 大调）中出现三小节，随后经连接过渡才作真正的再现。", "id": 543}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "肖邦《夜曲》（Op.48 之 No.1）再现部的类型？", "a": "动力化再现：结构规模基本不变（仅第三部分扩充两小节），但织体形态剧烈改变（左手变为与中部一致的三连音节奏、右手内声部填充密集三连音），主题呈现全新性格面貌。", "id": 544}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "比才《卡门》序曲中部的调性与主题是什么？再现部属于哪种类型？", "a": "中部调性变为主调降六级的 F 大调（较远关系），主题为《斗牛士之歌》；再现部属典型的减缩再现，将首部的再现单三部曲式减缩为一部曲式结构。", "id": 545}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "回旋曲式的定义及\"主部\"\"插部\"的含义？", "a": "回旋曲式指同一主题部分反复出现三次或三次以上、中间插入互不相同段落所形成的曲式结构；反复出现的相同主题部分称\"主部\"，其间插入的互不相同部分称\"插部\"，各插部之间也相互形成对比。", "id": 546}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "循环原则与再现原则的关系？\"三部—五部曲式\"\"双三部曲式\"\"回归曲式\"分别指什么结构？", "a": "循环原则本质上是\"多再现\"原则，在再现原则基础上发展而成；三部—五部曲式指 A B A B A（后两部分整体反复的通谱写法）；双三部曲式指 A B A B′ A（B 反复时移调）；回归曲式指 A B A′ C A……（主部再现时也作移调处理），主要用于巴洛克时期。", "id": 547}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "柴可夫斯基《连斯基咏叹调》的曲式结构及再现部特点？", "a": "再现单三部曲式（带前奏、连接、尾声）；再现部采用结构明显扩充、表现力十分丰富的动力化再现——短小动机连续两次向上模进形成全曲总高潮，表达连斯基对奥尔迦炽热的情感表白；尾声与前奏遥相呼应，体现封闭性与完整性。", "id": 548}, {"ch": "曲式·并列与再现曲式", "type": "简答", "q": "李斯特《你像一条鲜花》为何本教材将其视为再现单二部曲式？", "a": "分歧在第二部分后半：人声旋律看似与第一部分无联系（故多本教材作并列单二部），但第一乐句（b）结束后的连接中，A 部分开始处的主题先在属调清晰陈述并持续三小节，之后同一主题旋律又回到主调 A 大调以完满全终止结束——第二乐句实际以\"再现\"为主要特征，故为再现单二部曲式。", "id": 549}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "回旋曲式起源于什么？其原始形态中领唱与副歌如何交替？", "a": "起源于古代欧洲民间的轮舞歌曲，领唱与副歌交替出现：领唱歌词每次不同，副歌歌词每次不变。", "id": 550}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "古回旋曲式有哪些音乐特点？", "a": "曲式部分较多（可达十几个）、各部分规模小多为单一部曲式；主部与插部对比不大，插部常由主部材料引申展开；各部分独立、常以收拢终止结束、部分间无连接；插部基本用主调的近关系调甚至主调。", "id": 551}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "维也纳古典时期回旋曲式的成熟表现在哪些方面？", "a": "曲式部分数量精简（五部回旋曲式最常见）但规模增大、可为大于单一部的结构；对比程度增加；各部分间用连接过渡增强联系并常出现总结性尾声；通过调性与材料布局使整体发展有逻辑性。", "id": 552}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "单式回旋曲式与复式回旋曲式如何区分？", "a": "按曲式部分的结构规模划分：单式回旋曲式的主部或插部都为单一部曲式（标记 ABACA）；复式回旋曲式的主部与插部中都有大于单一部曲式的结构。类似单三部曲式与复三部曲式的关系。", "id": 553}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "插部领先的回旋曲式通常如何结束？为什么？", "a": "常以主部作为全曲的结束，以此突出强调主部在整首作品中的主导意义。", "id": 554}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "肖邦《玛祖卡》Op.7 之 No.1 属于哪种回旋曲式？各插部调性如何安排？", "a": "单式五部回旋曲式（ABACA）；第一插部转主调属大调 F 大调，第二插部转主调属小调 f 小调（与第一插部呈同名大小调关系，使用拿波里和弦）。", "id": 555}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "莫扎特《a 小调回旋曲》K.511 中主部第一次再现为何减缩为乐段？", "a": "主部为再现单三部曲式，若每次完整再现会使相同主题过多出现；减缩为一个乐段可加速整个乐曲发展进程——这种手法在主部为再现单三部曲式的复式回旋曲式中十分常见。", "id": 556}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "\"变奏\"\"变奏曲\"\"变奏曲式\"三个概念有何区别？", "a": "\"变奏\"是音乐发展的基本手法（变奏手法），可在各结构层面自由使用；\"变奏曲式\"是整首乐曲自始至终用不同变奏手法对主题多次完整反复形成的曲式结构；\"变奏曲\"是以变奏曲式为基础的音乐作品类型（体裁意义）。", "id": 557}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "固定基础变奏曲分哪三类？各自的固定基础是什么？", "a": "固定动机变奏曲（短小动机片段，多在低音部）、固定旋律变奏曲（完整主题旋律，分固定低音与固定高音旋律变奏曲）、固定和声变奏曲（固定的和声序进）。", "id": 558}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "帕萨卡里亚与恰空的区分要点有哪些？", "a": "关键区别：帕萨卡里亚的固定低音旋律是整个织体结构的根源和基础，恰空的固定低音只是固定和声序进的结果（可转位变化改变低音）。此外恰空以主调风格占优势（分解和弦音型、和声华彩）、纯器乐形式；帕萨卡里亚以复调风格占优势、较多用于声乐体裁。", "id": 559}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "变体主题变奏曲与固定基础变奏曲的本质区别是什么？", "a": "典型的固定基础变奏曲以不改变某种结构（动机、旋律、和声）的原形为基础，总有一个因素不变化；变体主题变奏曲中不存在固定不变的因素，进行变奏的基础就是主题自身。", "id": 560}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "严格变奏曲与自由变奏曲如何区分？各自有哪些别称？", "a": "严格变奏曲中主题结构保持不变，只有\"量\"变无\"质\"变，围绕主题旋律装饰加工，又称\"装饰变奏\"，古典时期形成故也称\"古典变奏曲\"；自由变奏曲加大变化使与原始主题关系隐藏甚至难以辨认、发生\"质\"变，主题性格明显变化，又称\"性格变奏曲\"，浪漫主义中晚期形成。", "id": 561}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "自由变奏曲的\"自由\"可以从哪些方面体现？", "a": "变奏后添加小结尾等附属曲式部分；变奏之间加入连接部分；针对主题中某一材料进行展开而形成展开式的变奏；偶尔出现带对比因素的新材料等。", "id": 562}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "变体主题变奏曲的主题一般应具备什么条件？常用什么曲式？", "a": "应具有鲜明特征和一定的可塑性，简练易记忆分辨，节奏单纯，调性明确，和声节奏适中，音区、速度、力度、织体密度处\"中间状态\"、个性不宜太强；曲式一般采用结构较为规整、包含一定对比因素的单二部曲式（也可用单一部或单三部曲式）。", "id": 563}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "肖斯塔科维奇《g 小调前奏曲》Op.87 之 No.12 的整体结构有何逻辑特征？", "a": "主题（12 小节）+九次变奏；作为全曲高潮和结构支点的\"变奏Ⅳ\"处于全曲中间偏后的\"黄金分割\"位置；邻近变奏以不同方式联合形成阶段性发展；整体完整体现\"起—承—转—合\"的曲式功能逻辑。", "id": 564}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "奏鸣曲式的基本特征是什么？为什么被视为最高级的单乐章曲式？", "a": "两个在调性和材料上相互对比的主题经过积极展开后，在再现时实现调性上的附合；有机体现矛盾产生、发展与解决的运动过程，利用材料对比产生的冲突构成音乐前进的动力，融入辩证思维。", "id": 565}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "什么是\"（主部）反复变连接\"现象？", "a": "开放性主部较多停在主调的属和声上形成类似乐段第一乐句的结构，而后以主部主题的反复开始并逐渐演变成为连接部——这是呈示部中十分常见的现象。", "id": 566}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "连接部完整时可包含哪三个阶段？", "a": "①在原调（主调）中逗留的部分；②实质性的转调部分；③在新调（副调）上为副部作准备的部分。", "id": 567}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "主部与副部的调性对比常规如何？主部小调时副部用什么调？", "a": "绝大多数副部主题在主调的属方面调性中出现；典型情况是主部为大调用属大调，主部为小调用关系大调。", "id": 568}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "结束部在副调中陈述主部主题材料有何特殊意义？", "a": "它与再现部中副部主题在主调中的附合相反相成，更加凸显主、副部之间对立统一的辩证发展关系。", "id": 569}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "展开部一般包括哪三个发展阶段？", "a": "引入阶段、实质性展开阶段、再现前的准备过渡阶段（和声上常为主调属和声持续，材料上预示主部再现，可能出现类似\"假再现\"的情况）。", "id": 570}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "展开部为什么多使用主调下属方向的调性？", "a": "呈示部主要涉及主调和副调（多为属调），展开部使用呈示部未涉及的下属方向调性，既可提高紧张度、促进戏剧性发展，又体现宏观和声功能运动：呈示部主属对立→展开部下属抗衡→再现部重立主功能统治地位。", "id": 571}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "奏鸣曲式中\"副部向主部的调性附合\"有何理论意义？", "a": "它是奏鸣曲式中至关重要的环节，通过突出强调主要调性的统治地位，平衡从连接部开始到展开部结束的长期非主调不稳定状态，实现再现部\"矛盾解决\"的功能使命；广义的\"奏鸣性\"或\"奏鸣原则\"即以此为标志。", "id": 572}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "再现部中材料减缩的常见方式有哪些？", "a": "主部多部曲式常减缩为一部曲式；\"反复变连接\"时可完全省略主部（连接部兼主部和连接部双重角色）或省略连接部；连接部中的转调部分常被省略；副部减缩多以陈述结构内部紧凑式发展实现；结束部作用降低、可简化为补充终止音型或在有独立尾声时完全省略。", "id": 573}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "奏鸣曲式的\"第二展开部\"指什么？为何得名？", "a": "指贝多芬中后期起出现的相对独立的尾声：先短暂延伸结束部，然后出现新的展开性因素，最后收束，如同对展开部和再现部作了压缩性的综合回顾；\"展开性\"是其区别于其他曲式尾声的主要特征，故称\"第二展开部\"，有的教科书将其列为第四部分并称\"收尾部\"。", "id": 574}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "奏鸣曲式的引子包含哪两个层面的意义？", "a": "呈示部的引子（短小、同速度节拍调式调性、直接铺垫主部）和整个奏鸣曲式的引子（规模较大、相对独立、可有呈示发展与收束，常慢速准备快板奏鸣曲式、可用下属方向调性、常预示后面主题）。", "id": 575}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "\"无展开部的奏鸣曲式\"常用于哪些场合？为什么？", "a": "常用于套曲的慢板乐章或其他速度较慢的作品（主副部舒缓如歌、对比不大，不适合展开性发展）；也常用于快速的歌剧、舞剧序曲（序曲只交待基本情绪和主要意境，主题只需简单亮相，不需宽阔发展）。", "id": 576}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "\"倒装再现的奏鸣曲式\"形成怎样的布局？带来什么结构性后果？", "a": "再现部中主部与副部次序颠倒，形成\"主部—副部—展开部—副部—主部\"的对称性布局；整体封闭性强、主部首尾呼应强化主导意义；再现部中连接部与结束部无法以原形式存在，常省略或以新材料代替。", "id": 577}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "协奏曲\"双呈示部\"中第一呈示部的调性处理有何特点？", "a": "第一呈示部（乐队陈述）的调性处理类似于再现部，即都在主调中陈述，即使副部开始在副调上，结束时也要转回主调，以为第二呈示部在主调中的出现作好准备。", "id": 578}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "华彩段最常出现在什么部位？从和声上讲它是什么？", "a": "最常出现在尾声开始前的终止式中：乐队以主调下属（或从属）功能和声引入并停在终止四六和弦上，独奏以技巧性手法对主题材料加工发展，结束时导入主调属和声；从和声上说华彩段是终止式的一个组成部分。此外它还可出现在再现部之前的属准备中。", "id": 579}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "回旋奏鸣曲式可从哪两个角度构成？哪一种更普遍？", "a": "①以循环曲式为基础，将其中一个插部（一般是第一插部）移到与主部相同调性上再现一次——外在浅层结合，实际运用较少；②以奏鸣曲式为基础，在呈示部副部之后将主部再现一次——结合更深内在，实践中使用更普遍，是教材讲述重点。", "id": 580}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "回旋奏鸣曲式为什么主要用在奏鸣—交响套曲的末乐章？", "a": "末乐章通常与胜利、欢呼或舞蹈性质相联系（回旋曲式擅长），但又要表现一定思想内涵并对整个套曲具有总结概括的结论性作用，因此综合了循环原则与奏鸣原则的回旋奏鸣曲式成为末乐章最理想的选择。", "id": 581}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "变奏手法与变奏曲式的界限是什么？变奏曲式的成形需借助什么？", "a": "变奏手法可在音乐各层面广泛自由使用；只有当整首乐曲自始至终持续用不同变奏手法对主题进行多次完整反复时才形成变奏曲式。变奏曲式除变奏手法外不包含其他特别的结构原则，其成形需借助附生性曲式结构原则（再现原则、循环原则、奏鸣原则等）。", "id": 582}, {"ch": "曲式·循环变奏与奏鸣曲式", "type": "简答", "q": "双主题变奏曲是什么？", "a": "用两个主题进行变奏的变奏曲形式，是大多数单主题变奏曲之外的偶尔出现的形式。", "id": 583}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "套曲曲式从结构原则看是什么原则在什么层面的复制？其对比扩大到哪些方面？", "a": "是并列原则在高级别乐章组合间的复制，即各乐章以并置对比方式组合；对比不仅限于主题材料，还扩大到体裁性格等各个方面。", "id": 584}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "套曲各乐章之间常从哪四个方面获得统一联系？", "a": "①主题、音调、动机的联系（相似音调节奏因素、主导动机贯穿、末乐章重现前面主题片断）；②调性布局（末乐章与首乐章同调、中间乐章用从属调性）；③速度（快慢对比呼应、渐变式变化）；④体裁（相近体裁呼应、首尾与中间形成反差）。", "id": 585}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "古组曲四个基本舞曲依次是什么？各源自哪国、速度与特征如何？整体速度布局如何？", "a": "阿勒曼德（德国，中庸、4/4、十六分音符弱起、复调性质）→库朗特（法国/意大利，三拍子；法式中庸复调多附点、意式较快主调）→萨拉班德（西班牙，缓慢庄严、无弱起、强拍在第二拍）→吉格（英国，热烈欢快、三拍子三连音、多用赋格）。速度布局为\"较慢的中速—较快的中速—慢速—快速\"，全曲统一在同一调性中。", "id": 586}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "古组曲可在哪些位置插入什么乐章？", "a": "在阿勒曼德舞曲前加前奏曲；在萨拉班德与吉格之间插入小步舞曲、加伏特舞曲、布列舞曲等舞曲；还可插入咏叹调、谐谑曲、随想曲等非舞曲性内容。", "id": 587}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "新组曲与古组曲相比有哪些新特点？分为哪两大类型？", "a": "①题材体裁扩展（个人与大众生活情感、诗歌小说绘画戏剧民族文化等）；②乐章数目不定、组合自由；③不再通篇同一调性；④以主调音乐语言为主。分为\"非标题情节性组曲\"和\"标题情节性组曲\"两大类。", "id": 588}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "《图画展览会》中贯穿各乐章的典型手法是什么？它属于哪类组曲？", "a": "在每个乐章中间起贯穿作用的\"漫步\"主题；属于\"标题情节性组曲\"。", "id": 589}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "奏鸣—交响套曲包括哪三种？与组曲的最大不同是什么？", "a": "包括室内奏鸣套曲、交响套曲、协奏套曲。与组曲最大不同在于：它在统一艺术构思前提下以各乐章间的明显对比对严肃深刻的内容进行广阔发展，各乐章联系更紧密（统一内容分配、调性布局、发展层次、主导乐思贯穿等内在联系）。", "id": 590}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "三乐章奏鸣—交响套曲各乐章的结构与调性安排如何？它源于什么？", "a": "源于意大利歌剧序曲\"快—慢—快\"三部分。第一乐章最重要、具戏剧性对比，多为奏鸣曲式；第二乐章抒情慢板，曲式自由，若用奏鸣曲式常用无展开部的变体；第三乐章常用回旋奏鸣曲式（或奏鸣曲式、变奏曲式）。首尾乐章原则上同一调性（小调第一乐章时第三乐章可为同主音大调），第二乐章常在主调下属方向调性内。", "id": 591}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "四乐章奏鸣—交响套曲中生活风俗性乐章的来源与演变如何？中间乐章常见的新变化是什么？", "a": "在慢板第二乐章与结束乐章之间插入生活风俗性乐章，起初即具古组曲舞蹈性质的小步舞曲，在贝多芬的奏鸣—交响套曲中逐渐被速度更快、生活气息更浓、更有特性的谐谑曲替代；该乐章起初用主调，贝多芬常采用从属调性后被普遍效仿。新变化是两个中间乐章常交换位置：快板第一乐章→快速第二乐章→慢板第三乐章反衬→快速第四乐章。", "id": 592}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "为什么说前奏曲与赋格、《24首前奏曲》不是真正意义上的套曲？", "a": "它们只是音乐实践中经常使用并积累下来的相对固定模式，不属于按统一构思原则组合起来的套曲，只具有某种特定的格式化意义：前奏曲多主调（或主复调结合）陈述、赋格为严格复调；24首前奏曲之间可无任何联系，仅按24个大小调呈示。", "id": 593}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "清唱剧与康塔塔有何区别？二者共同发展为歌剧提供了哪两种重要声乐体裁？其区别是什么？", "a": "清唱剧多采取重大题材、强调戏剧性情节性、规模较大；康塔塔常无完整情节发展，围绕一个中心命题多角度多层面表述，规模较小。二者中发展出的朗诵调（陈述接近口语化朗读）与咏叹调（歌唱性旋律）后来成为歌剧最重要的声乐表述方式。", "id": 594}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "歌剧与清唱剧有哪些联系与区别？歌剧的器乐部分有何特点？", "a": "联系：都有文字脚本、都应用各种声乐体裁、都有乐队伴奏。区别：清唱剧情节细致性连贯性不如歌剧、不作戏剧性舞台表演、声乐体裁范围较窄；歌剧在舞台上综合多种艺术表现细致情节，声乐体裁更广泛。歌剧器乐部分作用最突出，除伴奏外还有序曲、前奏曲、间奏曲、幕间曲、进行曲、夜曲、舞蹈音乐、过场音乐等独立段落，对揭示发展戏剧性矛盾冲突作用巨大。", "id": 595}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "分曲组成的歌剧与贯连发展的歌剧各有什么结构与优缺点？", "a": "分曲组成的歌剧\"场\"\"景\"划分明显，音乐为多个相对完整独立段落，分曲完整、利于角色发挥演唱技巧，但易割裂情节连贯性、拖延剧情；贯连发展的歌剧\"场\"划分不明显，以主导主题或动机为基础不间断贯穿发展，利于表现戏剧性矛盾冲突、形成戏剧性高潮。实际创作中常将两种长处结合。", "id": 596}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "什么是变体曲式？它在哪两个层面实现变化？\"集中对称曲式\"的结构图示是什么？", "a": "变体曲式是在单一曲式结构原则不变情况下曲式结构产生的各种变体形式，以规范化曲式为参照。两个层面：①单一曲式一次性陈述中局部变化（倒装再现/集中对称曲式、部分增删、简单再现中调性变化）；②整体反复形成的组合（直接相继反复、首尾叠搭反复）。集中对称图示：A B C B A 或 A B C D C B A。", "id": 597}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "边缘曲式有哪两种情况？前景曲式、背景曲式、隐蔽性曲式如何区分？", "a": "①同一曲式结构中有机融合两种或三种不同曲式结构原则；②同一曲式结构原则范围内形成的中介性结合（中介曲式）。诸原则结合中通常有一种起主导作用称前景曲式，其余按程度不同成为背景曲式或隐蔽性曲式。", "id": 598}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "促使规范化曲式向边缘曲式演化的主要因素有哪些？", "a": "曲式部分间比例关系的变动、组合关系的变化、曲式部分的增删、曲式部分中主题内容的性质、调性与终止式的变动、曲式结构程式的变动以及曲式功能的转换等。", "id": 599}, {"ch": "曲式·套曲与非规范化曲式", "type": "简答", "q": "自由曲式的定义是什么？主要应用于哪两类作品？分析重点应放在哪里？", "a": "曲式组成部分不按某种单一规范化曲式结构原则组织，也没有明确的两种或三种原则从头到尾一致结合，即属自由曲式。应用于：①只有体裁或标题而无情节性内容的作品（夜曲、幻想曲、随想曲等）；②描述明确叙事性内容或情节且有具体标题的作品（舒伯特《魔王》、斯美塔那《伏尔塔瓦河》）。分析重点应放在形象内容发展中曲式功能的逻辑运动，如\"呼应\"\"起—开—合\"\"起承转合\"及其在多层组合中的复杂变体。", "id": 600}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "自然音体系和弦的范围包括哪些调式的和弦？", "a": "自然大小调与和声大小调的所有和弦，不含这两种调式以外的变音；旋律调式的和弦列为同主音大小调调式交替和弦。", "id": 601}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "大小调体系和声的基础调式是哪两个？", "a": "自然大调与和声小调。", "id": 602}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "和声大调、和声小调分别在调号基础上作什么变化？", "a": "和声大调降低六级音，和声小调升高七级音。", "id": 603}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "大小调体系中仅有的两种协和三和弦是什么？", "a": "大三和弦与小三和弦；增、减三和弦为不协和和弦。", "id": 604}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "七和弦的第一、二、三转位分别叫什么？低声部分别是什么音？", "a": "第一转位五六和弦（三音在低声部）、第二转位三四和弦（五音在低声部）、第三转位二和弦（七音在低声部）。", "id": 605}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "功能/音级混合标记体系中，副三和弦的标记依据是什么？写出C大调各级三和弦的功能标记。", "a": "副三和弦根据它与某个正三和弦存在的两个共同音同时标出功能与音级：T、SⅡ、DTⅢ、S、D、TSⅥ、DⅦ。", "id": 606}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "功能字母大小写在四种调式（自然大调、和声大调、和声小调、自然小调）中的规则是什么？", "a": "自然大调：T、S、D均大写；和声大调：T、D大写、s小写；和声小调：t、s小写、D大写；自然小调：t、d均小写。", "id": 607}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "K₄⁶ 与 D₄⁶ 音相同，区别是什么？K₄⁶ 之前的和弦有什么限制？", "a": "K₄⁶ 必须用于固定的和声语汇中；K₄⁶ 之前基本不会是本调的 D 或 D₇。", "id": 608}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "K₄⁶ 之后一般解决到哪些和弦？语汇中间可插入什么和弦？", "a": "解决到原位D、原位D₇、D₇的转位、DⅦ/TSⅥ、D₇/TSⅥ等；中间可插入不受强调的辅助和弦（通常是S组或DD组的和弦）。", "id": 609}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "复拍子作品中 K₄⁶ 的节拍位置规则如何？请举 4/4 拍一例。", "a": "K₄⁶ 的位置通常不比解决和弦弱；复拍子中可置于次强拍、解决和弦置于强拍，如 4/4 拍：S — K₄⁶ | D₇ — T |。", "id": 610}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "除 K₄⁶ 外还有哪几类四六和弦？各自的特点是什么？", "a": "①经过/辅助性四六和弦：弱四六、时值短、节拍位置弱，低音为经过音、辅助音或长音；②假四六和弦：由低声部节奏音型化（同和弦转换）、旋律在低声部或低声部旋律化、外音形成；③自由四六和弦：浪漫派开始使用的较自由用法。", "id": 611}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "SⅡ、TSⅥ 的常用形式分别是什么？DⅦ、DTⅢ 使用频率如何？", "a": "SⅡ常用第一转位，TSⅥ常用原位，二者较常用；DⅦ与DTⅢ属D组副三和弦，不太常用。", "id": 612}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "偶尔使用的两个七和弦 SⅡ₇、T₇ 各用于什么位置？七音如何处理？", "a": "SⅡ₇偶尔代替S组其他和弦用于D组和弦之前，T₇作为经过性和弦用于T与S组和弦之间；两处七音均需级进下行解决；若七音不受强调，视为外音，把T₇看作三和弦。", "id": 613}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "哪些七和弦属于不常用七和弦？一般用于何处？", "a": "TSⅥ₇、DTⅢ₇以及自然小调的dⅦ₇；一般只用于自然音模进中或偶尔作为经过性和弦。", "id": 614}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "D₇ 的七音位置与转位使用有什么特点？", "a": "七音几乎总处于最高声部，传统和声中几乎只使用原位，少数情况可见两个转位：D₅⁶与D₃₄。", "id": 615}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "D₉ 是什么结构的和弦？有的理论体系把它标记为什么？", "a": "D₉是六音代替五音的D₇和弦，六音几乎总在高声部，几乎只用原位（偶尔见D₅⁶、D₃₄两个转位）；有的体系标记为D₁₃，十三音即隔开八度的六音。", "id": 616}, {"ch": "和声·自然音体系和弦", "type": "简答", "q": "D₇⁺⁶ 的特点是什么？它与 DTⅢ 的区别在哪里？", "a": "D₇⁺⁶是六音代替五音的D和弦，极少用，基本同D₉但没有转位；它与DTⅢ音相同，但D₇⁺⁶是特殊的D组和弦，用在D组其他和弦前后或T之前。", "id": 617}, {"ch": "和声·和弦外音与持续音", "type": "简答", "q": "1. 分析和声时的总原则是什么？", "a": "所有音包括装饰音都尽量作为和弦音考虑，只有遇见非三度叠置结构、不常用的和弦或和声进行时，才考虑外音与持续音的存在。", "id": 618}, {"ch": "和声·和弦外音与持续音", "type": "简答", "q": "2. 什么是和弦外音？分哪两类？", "a": "与和弦同时存在但不属于和弦内的音，分为强外音与弱外音两种基本类型。", "id": 619}, {"ch": "和声·和弦外音与持续音", "type": "简答", "q": "3. 强外音的定义与解决要求？", "a": "和弦一出现就存在的或与和弦同时出现的外音；需要级进（含增一度）解决到和弦音，节拍位置一般不弱于其解决音。", "id": 620}, {"ch": "和声·和弦外音与持续音", "type": "简答", "q": "4. 什么是隐伏声部解决？", "a": "在强外音与解决音之间插入时值较短暂的一个到多个其他音，使强外音以隐伏声部的形式解决到和弦音。", "id": 621}, {"ch": "和声·和弦外音与持续音", "type": "简答", "q": "5. 强外音如何影响和弦标记？", "a": "标记和弦时直接将强外音看成其解决音来标记和弦。", "id": 622}, {"ch": "和声·和弦外音与持续音", "type": "简答", "q": "6. 弱外音的特征与标记方法？", "a": "在和弦持续过程中出现的外音，时值较均匀、节拍位置较弱，与其两端至少一端级进或同音反复；标记时忽略不计，默认是前面的音在延续。", "id": 623}, {"ch": "和声·和弦外音与持续音", "type": "简答", "q": "7. 持续音的定义与最常见类型？", "a": "在某声部（最常见低声部）出现的延续或反复的音，可长音或音型化、织体化，相对独立于其他声部和声语汇；最常见的是主持续音与属持续音。", "id": 624}, {"ch": "和声·和弦外音与持续音", "type": "简答", "q": "8. 持续音的典型特征是什么？", "a": "从和弦音开始并结束于和弦音上，持续过程中可和弦音可外音，但至少在一个和弦中是外音；始终为和弦音的长音一般不算持续音。", "id": 625}, {"ch": "和声·和弦外音与持续音", "type": "简答", "q": "9. 持续音的标记如何书写？", "a": "先写持续音的功能再加\"——\"；在低声部标在和弦下方，在上方声部标在和弦上方。", "id": 626}, {"ch": "和声·和弦外音与持续音", "type": "简答", "q": "10. 低声部持续音上方和弦转位如何标记？", "a": "开始与结束的和弦可写转位，中间和弦因无真正低音可不写转位：三和弦统一写原位，七和弦统一写 X₇。", "id": 627}, {"ch": "和声·和弦外音与持续音", "type": "简答", "q": "11. 七和弦的省略音规则？", "a": "一般可省略五音或三音；在和弦转换等特定情况下还可省略根音或七音，如 D 或 K₄⁶ 后的 D₇ 可省略根音，表面看起来像 DVII₇。", "id": 628}, {"ch": "和声·和弦外音与持续音", "type": "简答", "q": "12. 复调织体与主调织体各自的基本技术手段？", "a": "复调织体的基本手段是对位法；主调织体的基本手段是和声；二者可相互融合。", "id": 629}, {"ch": "和声·变化音和弦", "type": "简答", "q": "1. 变化音和弦的范围如何界定？", "a": "含有调式（自然与和声大小调式）外变化音的和弦；本教程将所有离调和弦（无论是否含变音）、变和弦与同主音大小调调式交替和弦均归为变化音和弦。", "id": 630}, {"ch": "和声·变化音和弦", "type": "简答", "q": "2. 分析变化音和弦最关键看什么？", "a": "最关键的是看和弦结构，其次是看前后关系。", "id": 631}, {"ch": "和声·变化音和弦", "type": "简答", "q": "3. 离调的基本含义是什么？", "a": "在基本调进行中，以调内主和弦之外的某大、小三和弦为临时主和弦，使用该临时调（副调）的和弦与和声语汇；离调不瓦解主调。", "id": 632}, {"ch": "和声·变化音和弦", "type": "简答", "q": "4. 离调和声语汇能形成什么样的终止？", "a": "多处于结构内部，少数可形成中间型终止（半终止、阻碍终止或不完满全终止等），但不会形成段落的全终止。", "id": 633}, {"ch": "和声·变化音和弦", "type": "简答", "q": "5. 哪些和弦能做副主和弦？", "a": "主和弦之外大、小三和弦结构的自然音和弦、调式交替和弦与那不勒斯和弦；增、减三和弦不能做副主和弦。", "id": 634}, {"ch": "和声·变化音和弦", "type": "简答", "q": "6. 如何由 D 类和弦快速找到副调主音？", "a": "D 类和弦三音上方小二度为副调主音（DVII 类则看根音上方小二度）。", "id": 635}, {"ch": "和声·变化音和弦", "type": "简答", "q": "7. 副属、副下属和弦的标记格式？", "a": "x/y：x 为该和弦在副调中的功能标记，y 为副主和弦在主调中的标记。", "id": 636}, {"ch": "和声·变化音和弦", "type": "简答", "q": "8. 副属和弦有哪几种进行方式？", "a": "常规进行（到副主和弦）、代替进行（到与副主有两个或三个共同音的和弦，不要求升降号相同）、半音进行（部分或全部声部半音变化后进行到各种和弦）；重属和弦还可用在任何和弦之前作特殊下属功能。", "id": 637}, {"ch": "和声·变化音和弦", "type": "简答", "q": "9. 副下属和弦的常规进行是怎样的？", "a": "进行到副主和弦或同一副主的副属和弦，组成副调的变格进行、完全进行、半成进行等，如 S组/x—D组/x 或 S组/x—x。", "id": 638}, {"ch": "和声·变化音和弦", "type": "简答", "q": "10. 离调和弦分析的三步骤？", "a": "①按和弦结构确定\"/\"上方功能标记；②找副主和弦确定\"/\"下方标记；③根据前后和弦与和声进行验证，从多种可能中选最合适的标记。", "id": 639}, {"ch": "和声·变化音和弦", "type": "简答", "q": "11. 变和弦是如何形成的？", "a": "不稳定功能（D 组或 S 组）解决到 T 时，为加强半音化倾向，将原本大二度的声部进行通过升高或降低和弦音变为小二度进行，形成带变音的不稳定功能和弦。", "id": 640}, {"ch": "和声·变化音和弦", "type": "简答", "q": "12. 变和弦的标记方法？", "a": "在和弦标记的左上角增加升降标识，如 ♯D 表示升高五音的 D 和弦，♭SII 表示降低根音的 SII 和弦。", "id": 641}, {"ch": "和声·变化音和弦", "type": "简答", "q": "13. 三个常用重属变和弦是什么？", "a": "意大利和弦（♯₃♭₅DVII₇—D）、法兰西和弦（♯₃♭₅D₇/D）、德意志和弦（♭₅DVII/D）；也可用原位或别的转位。", "id": 642}, {"ch": "和声·变化音和弦", "type": "简答", "q": "14. 那不勒斯和弦的结构与常用形式？", "a": "降 II 级音上建立的大三和弦，常用第一转位，又叫那不勒斯六和弦；大调中同时用降 VII 级音，故无论大调小调 s 都小写；也可用七和弦 ♭SII₇（七音多为经过性）。", "id": 643}, {"ch": "和声·变化音和弦", "type": "简答", "q": "15. 大调的 ♭SII₆ 通常如何进行？", "a": "极少使用，一般进行到原位的 T，用于变格进行尤其是变格终止中；有时也进行到 T₆ 或 K₄⁶。", "id": 644}, {"ch": "和声·变化音和弦", "type": "简答", "q": "16. 遇到增三和弦如何分析？", "a": "先看是不是后面和弦的 ♯₅D（♯₅D 或 ♯₅D₇）；再看是不是 TSVI（sVI）或 DTIII（dIII）；都不合适则可能是外音形成的增三和弦。", "id": 645}, {"ch": "和声·变化音和弦", "type": "简答", "q": "17. 什么是同主音大小调交替和弦？其标记方法？", "a": "同主音大小调相互借用对方和弦而产生带变音的和弦；标记直接借用同主音调的标记，通过改变功能字母大小写区别。", "id": 646}, {"ch": "和声·变化音和弦", "type": "简答", "q": "18. 大调与小调典型的调式交替和弦分别有哪些？", "a": "大调：借用同主音自然小调的 T 组与 S 组五个和弦（t、dtIII、d/tsVI、dVII 等）；小调：借用同主音自然大调的 T 组与 S 组五个和弦（T、SII、DTIII、S、TSVI）。", "id": 647}, {"ch": "和声·变化音和弦", "type": "简答", "q": "19. 什么是皮卡迪终止式？", "a": "将小调音乐作品或段落结束在大主和弦 T 上的终止式；盛行于文艺复兴与巴洛克时期，古典主义以后较少使用。", "id": 648}, {"ch": "和声·变化音和弦", "type": "简答", "q": "20. 大调 tsVI 的常见用法？", "a": "tsVI 代替 TSVI 用在 D 之后做阻碍进行或阻碍终止。", "id": 649}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "调性转换与离调、调式交替的本质区别是什么？", "a": "调性转换突破了原有的调性；而离调与调式交替虽然使用其他调的和弦与和声语汇、一定程度上动摇基本调的地位，但其效果更多是丰富基本调，并不瓦解基本调。", "id": 650}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "调性转换的四种类型分别是什么？", "a": "与终止相关的两种：终止的调性转换、结构（语汇）间调性对置；与终止无关的两种（调性漂移）：经过性转调、转调（换调）模进。", "id": 651}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "什么是\"调性漂移\"？通常发生在什么结构部位？", "a": "若干没有终止性语汇的调性片断组合在一起，没有任何一个调居于控制地位的现象。通常发生在调性不稳定的结构部位，如乐曲的中部（展开部）或连接（连接部）。", "id": 652}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "古典音乐中新调全终止的典型写法是什么？", "a": "多数情况下使用原位的 D 或 D₇ 等进行到原位的 T，并且 T 和弦处于音乐的结构点上。", "id": 653}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "经过性转调中，过渡调性何时视为离调？视为谁的离调？", "a": "过渡调相对前后两调时间较短时通常视为离调；多数视为前调的离调（向转调共同和弦的离调），少数视为后调的离调（向转调和弦离调）。", "id": 654}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "和声模进的三种基本类型及各自特点？", "a": "自然音模进（调内模进，只用自然音和弦，功能和声中很少用）；离调模进（半音模进，用离调和弦，主题内部乐思展开手段，不瓦解基本调，之后多回到基本调）；转调（换调）模进（用不同调性，乐思展开手段，用于中部或连接部，之后到达新调不再回来）。", "id": 655}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "判断调性时升降号的作用是什么？明确调性的四个和弦有哪些？", "a": "升降号只能作为参考依据，须根据和弦、和声进行与音乐材料尤其是旋律综合判断；结构较稳定的 D、D₇、DVII、SII 等和弦能帮助确定调性。", "id": 656}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "共同和弦通常出现在什么位置？", "a": "通常是上一结构（语汇）的结束和弦，也可能是下一结构的开始和弦；通常是后调特征音之前的和弦（特征音是前后调升降号不同的音）。", "id": 657}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "选择共同和弦的四条一般规律？", "a": "自然音和弦优先于变化音和弦；常用和弦优先于较常用或不常用和弦；三和弦优先于七和弦；最好不用 K46 做共同和弦。", "id": 658}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "什么情况下可能出现\"没有共同和弦的直接调性转换\"？", "a": "共有两个调各自特征音的和弦直接对峙、无法找到合理的共同和弦时。", "id": 659}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "分析带调性转换乐曲的四个步骤？", "a": "①简单划分曲式结构（找相同材料与全终止）；②确定调性布局（注意全终止前后及调性漂移）；③确定调性转换的共同和弦；④填充其余和声并检验转调/离调标记是否误判。", "id": 660}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "简单等和弦与复杂等和弦的区别？", "a": "简单等和弦全部音为等音关系，根音与性质都相同，只是升号调与降号调记谱转换；复杂等和弦部分音相同部分音为等音，根音必然不同，性质可能相同也可能不同。", "id": 661}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "哪些和弦可以做复杂等和弦？为什么？", "a": "减七和弦、大小七和弦、增三和弦（及较少见的法兰西和弦）等；关键在于根音的可变性——它们的每个音（或特定音）都可做根音形成新的等音和弦。", "id": 662}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "十二平均律中有几个真正不同的减七和弦？减七和弦等和弦转调的适用范围？", "a": "只有两个真正不同的减七和弦；由于任何减七和弦都同时属于大小二十四调，减七和弦等和弦转调适用于任何转调。", "id": 663}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "将减七和弦标记为正三和弦导七的三个步骤？", "a": "①写出调式的正音级（T、S、D）；②看减七和弦中哪个音向上半音能与正音级相同，确定根音与功能；③根据确定的根音与谱面低音标记转位。", "id": 664}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "大小七和弦等和弦的两种构成方法？", "a": "方法一：以一个调 D₇（或 D₇/?）的七音作根音，等于另一调的 ♭₅DVII₇、♯DVI 或 ♭₅SI；方法二：以 D₇（或 D₇/?）的五音作根音，等于另一调的 ♭₅DVII₇。", "id": 665}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "大小七和弦等和弦转调最典型的用法？选择时的优先原则？", "a": "典型用法是前调的 D₇（或 D₇/?）等于后调的 ♭₅DVII₇/D；若能用自然音和弦、那不勒斯和弦等做共同和弦则一般不选它，且与减七和弦皆可用时优先减七和弦。", "id": 666}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "增三和弦功能的三种基本类别？", "a": "①和声大调的 TSVI₊（♯₅TSVI）；②和声小调的 DIII₊（♭₃DIII）；③大调或小调的 ♯₅D（含大三和弦离调的 ♯₅D）。", "id": 667}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "增三和弦等和弦转调时前后两调的判断顺序？", "a": "前调：先自然音和弦（TSVI₊ 或 DIII₊），再 ♯₅D（或 ♯₅D/?）；后调：先判其是否为转调和弦（大三或属七）的 ♯₅D，再自然音和弦，最后 ♯₅D（优先正三和弦的 ♯₅D）。", "id": 668}, {"ch": "和声·转调与等和弦", "type": "简答", "q": "法兰西和弦如何用于等和弦转调？", "a": "将某个法兰西增六和弦的五音作为根音等音记谱，会形成另一个法兰西和弦，如将 ♯₅D₇（或 ♯₅D₇/?）的五音作根音变成另一调的 ♯₅D₇（或 ♯₅D₇/?）。", "id": 669}];
const KEY='adan_quiz_v1';
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
let round=[],cur=0,curCh='all';
const chs=[...new Set(DATA.map(q=>q.ch))];

function subj(c){return c.indexOf('曲式')===0?'曲式与作品分析':c.indexOf('和声')===0?'和声分析':'西方音乐史'}
function fill(selId,list,allLabel){
  const s=document.getElementById(selId);s.innerHTML='';
  const o=document.createElement('option');o.value='all';o.textContent=allLabel;s.appendChild(o);
  const groups={};list.forEach(c=>{(groups[subj(c)]=groups[subj(c)]||[]).push(c)});
  Object.keys(groups).forEach(g=>{
    const og=document.createElement('optgroup');og.label=g;
    groups[g].forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;og.appendChild(o)});
    s.appendChild(og);
  });
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}

function start(){
  round=[...pool()].sort(()=>Math.random()-.5).slice(0,4);cur=0;
  const box=document.getElementById('p-quiz');
  box.querySelectorAll('.qcard,.prog').forEach(e=>e.remove());
  document.getElementById('sel').style.display='none';
  document.querySelector('#p-quiz .btn').style.display='none';
  const prog=document.createElement('div');prog.className='prog';prog.id='prog';box.appendChild(prog);
  showQ();
}
function pool(){return curCh==='all'?DATA:DATA.filter(q=>q.ch===curCh)}
function showQ(){
  document.getElementById('prog').textContent='— 第 '+(cur+1)+' / '+round.length+' 题 · '+round[cur].ch+' —';
  const q=round[cur],d=document.createElement('div');d.className='card';
  d.innerHTML='<div class="qtag"><span>'+q.type+'</span><span>'+subj(q.ch)+'</span></div>'
    +'<div class="qtext">'+esc(q.q)+'</div>'
    +'<div class="ans" id="ans">✦ '+esc(q.a)+'</div>'
    +'<button class="showbtn" onclick="document.getElementById(\'ans\').classList.add(\'show\');this.style.display=\'none\'">亮出答案</button>'
    +'<div class="rate">'
    +'<button class="r2" onclick="rate(2,this)">没把握</button>'
    +'<button class="r1" onclick="rate(1,this)">半懂</button>'
    +'<button class="r0" onclick="rate(0,this)">稳了</button>'
    +'</div>';
  document.getElementById('p-quiz').appendChild(d);
}
function rate(v,btn){
  state[round[cur].id]=v;save();
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  setTimeout(()=>{cur++;if(cur<round.length){showQ()}else{finish()}},300);
}
function finish(){
  const d=document.createElement('div');d.className='card';d.style.textAlign='center';
  d.innerHTML='<div class="qtext">本 轮 完 成</div>'
    +'<p style="margin-top:10px;color:var(--faded);font-size:13px">进度已存档。「没把握」的题建议隔天重刷。</p>'
    +'<button class="btn" style="margin-top:14px" onclick="location.reload()">再 来 一 轮</button>';
  document.getElementById('p-quiz').appendChild(d);
  refreshStats();
}
function refreshStats(){
  const done=Object.keys(state).length;
  const c=[0,0,0,0];Object.values(state).forEach(v=>c[v]++);
  s('s-total',DATA.length);s('s-done',done);s('s-red',c[2]+c[1]);s('s-green',c[0]);
  document.getElementById('s-bar').style.width=(done/DATA.length*100)+'%';
  const box=document.getElementById('chStats');box.innerHTML='';
  chs.forEach(ch=>{
    const qs=DATA.filter(q=>q.ch===ch),r=qs.filter(q=>state[q.id]!==undefined);
    const pct=r.length?Math.round(r.filter(q=>state[q.id]===0).length/r.length*100):0;
    const icon=pct>=90?'◉':pct>=70?'◍':pct>=40?'◌':r.length?'○':'·';
    const col=pct>=90?'var(--moss)':pct>=40?'var(--gold)':'var(--bad)';
    const d=document.createElement('div');d.className='chrow';
    d.innerHTML='<span>'+icon+' '+ch+'</span><span class="pct" style="color:'+col+'">'+(r.length?r.length+'/'+qs.length+' · 会 '+pct+'%':'未测')+'</span>';
    box.appendChild(d);
  });
}
function s(id,v){document.getElementById(id).textContent=v}
function renderList(){
  const v=document.getElementById('sel2').value;
  const qs=v==='all'?DATA:DATA.filter(q=>q.ch===v);
  const box=document.getElementById('listBox');box.innerHTML='';
  qs.forEach(q=>{
    const st=state[q.id];
    const col=st===0?'var(--ok)':st===1?'var(--warn)':st===2?'var(--bad)':'var(--line)';
    const d=document.createElement('div');d.className='card';
    d.innerHTML='<div class="qtag"><span><span style="color:'+col+'">●</span> '+q.type+' · '+q.ch+'</span></div>'
      +'<div class="qtext" style="font-size:15px;font-weight:500">'+esc(q.q)+'</div>'
      +'<div class="ans">✦ '+esc(q.a)+'</div>'
      +'<button class="showbtn" onclick="this.style.display=\'none\';this.previousElementSibling.classList.add(\'show\')">亮出答案</button>';
    box.appendChild(d);
  });
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');document.getElementById('p-'+b.dataset.p).classList.add('on');
  if(b.dataset.p==='stats')refreshStats();
});
fill('sel',chs,'全部科目 · 随机抽题');
fill('sel2',chs,'全部科目');
document.getElementById('sel').onchange=e=>curCh=e.target.value;
refreshStats();
</script>
</body>
</html>
